# openai.yaml — Codex skill interface for the converted `a2h-init-zh` command.
# When the user selects this skill in /skills, `interface.default_prompt` is
# auto-attached — the Codex equivalent of running the slash command.
interface:
  display_name: "a2h-init-zh"
  default_prompt: |
    Run the $a2h-init flow now: provision the runtime, run the User Experience Improvement Plan consent flow, confirm the android/harmonyos/deveco/hvigorw/adb/hdc paths, and set confirmed:true. Treat any user input as ignored.

policy:
  allow_implicit_invocation: true
