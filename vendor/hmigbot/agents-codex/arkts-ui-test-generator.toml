## MODE=register（单一 owner）

TEST_SCOPE=NAVIGATION 在 scaffold 完成后即可派单一 register owner，不等待页面功能编写；只扫描并注册 navigation preflight。TEST_SCOPE=ALL 必须等待 generate/journeys 完成，核对 EXPECTED_PAGES、planned ID 与映射版本后再执行下列全量注册；期间暂停全部代码写入。

### 1. 递归发现并显式注册

1. 递归枚举 `entry/src/ohosTest/ets/test/ui/**/*.test.ets`，覆盖 `pages/`、`navigation/`、`journeys/`；不能只匹配旧平铺目录。
2. 若同仓存在 `entry/src/ohosTest/ets/test/spec/**/*.test.ets`，同样递归纳入。
3. 读取每个文件确认唯一 default export 函数和 describe 名；文件、export、测试 ID 重复均 BLOCK。按导航设计记录 NAVIGATION 精确 suite 列表、FUNCTION 页执行顺序及生命周期专项列表，不能用文件字母序代替页面调度计划。
4. 以规范化相对路径排序，完整重建 `entry/src/ohosTest/ets/test/List.test.ets`：每个文件一条显式 import，在 `testsuite()` 中一条显式调用。
5. 重建后再次递归扫描，逐文件对账 import 与调用：不得漏项、重复或依赖运行时 glob。

register 不修改任何测试内容，不因预期编译问题注释文件或添加 Ignore。

### 2. register 返回

```text
MODE: register
LIST_TEST_PATH: entry/src/ohosTest/ets/test/List.test.ets
REGISTERED_PAGE_FILES: <N>
REGISTERED_NAV_PREFLIGHT_FILES: <N>
REGISTERED_JOURNEY_FILES: <N>
REGISTERED_UT_FILES: <N>
REGISTERED_IT_COUNT: <N>
REGISTERED_TEST_IDS: <按规范化路径和源码顺序列出全部稳定 ID>
MISSING_OR_DUPLICATE: 0
BLOCKERS: <none | 描述>
```

## 交付自检

- grep 生产与测试改动：本步不得新增生产 `.id()`、`__TARGET_PAGE__`、`__TEST_MODE__`、TestDataSetup、NavigationTestService、mountPage/mountTarget、测试用 `router.replaceUrl`、NavPathStack clear/push 或目标页 loadContent，也不得生成额外定位清单。
- grep `ui/navigation/**/*.flow.ets`：不得出现 `ON.`、selector 字面量或直接路由 API。
- grep `ui/pages/**/*.test.ets`：不得出现 `ON.`、AppStorage、find/wait API 或 Component 变量。
- 核对全局导航门、套级准入、逐例基线和 UI 清理都已生成；普通 beforeEach/afterEach 无启动/终止/复位，恢复失败有安全停止和调度证据。
- grep 全部 UI 测试：不得 `await Driver.create()`、不得让 UI API 进入 Promise.all/race、不得用固定 delay 作为到页判定、不得空 catch。
- Page Object 的 locator 只能是既有稳定 `id`，或唯一/在可见容器内消歧的可见文本；不得有坐标点击、索引定位、类型/层级位置定位。
- design §B 的 `RUNNABLE` 功能点与生成测试一一对应；`IMPL_MISSING_STATIC` 保留稳定 ID 但没有伪 Page Object 动作或测试，且不能把“action 可执行、结果失败/缺失”误归为静态缺口。
- 每个 RUNNABLE planned ID 恰好生成一次：PAGE 由对应 `MODE=generate` owner 写入 `ui/pages/<page_short>/`，JOURNEY 由 MODE=journeys 单一 owner 写入 `ui/journeys/`；同一 ID 不得跨两类目录重复。
- 所有页面功能点、canonical flow preflight、navigation edge 与注册文件都有唯一稳定的测试标识；多目录测试由 `List.test.ets` 显式导入和调用。
'''
