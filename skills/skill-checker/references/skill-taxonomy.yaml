  state:       "状态管理"
  navigation:  "导航路由"
  data:        "数据层/网络"
  media:       "媒体/下载"
  system:      "系统能力"
  migration:   "迁移专用"
  engineering: "工程配置"
  general:     "通用/跨领域"

style-sets:
