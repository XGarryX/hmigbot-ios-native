  domain:      "领域知识 — 某个技术领域的专业能力"
  style:       "风格规范 — 编码标准和最佳实践"
  codebase:    "代码操作 — 对现有代码库的分析、修改、调试"
  tool:        "工具 — 通用辅助工具，不绑定特定领域"

domains:
