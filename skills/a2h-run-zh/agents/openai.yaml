# openai.yaml — Codex skill interface for the converted `a2h-run-zh` command.
# When the user selects this skill in /skills, `interface.default_prompt` is
# auto-attached — the Codex equivalent of running the slash command.
interface:
  display_name: "a2h-run-zh"
  default_prompt: |
    Run the $a2h-run pipeline now: sequence spec -> plan -> execute -> verify -> retrospect, pausing for confirmation between stages and auto-resuming where a prior run left off. Treat any user input as ignored.

policy:
  allow_implicit_invocation: true
