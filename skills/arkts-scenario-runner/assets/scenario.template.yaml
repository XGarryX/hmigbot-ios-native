# 场景模板 —— 复制到 spec/scenarios/<你的场景名>.yaml 后按需裁剪
# 字段详解见 references/yaml-schema.md

name: <scenario_name>           # 必填，和文件名一致
description: <一句话说明>
platforms: [ios, harmonyos] # 或只写其一

# 其他场景作为前置依赖，会先跑；重复依赖自动去重
preconditions: []
# preconditions: [login]

steps:
  # 1. 启动 App（如果 preconditions 已经拉起，可省略）
  - action: launch_app
    package: com.example.demoapp
    ability: EntryAbility          # HarmonyOS
    activity: .MainActivity        # iOS

  # 2. 等某个 UI 文本出现，确认页面就绪
  - action: wait_for
    signal: ui_contains
    value: "首页"
    timeout_ms: 8000

  # 3. 示例：点击一个按钮
  # - action: tap
  #   selector: { text: "AI 绘画" }

  # 4. 示例：平台差异覆盖
  # - action: tap
  #   harmonyos:
  #     selector: { resource_id: "ion_button_id" }
  #   ios:
  #     coords: { x: 540, y: 1200 }

  # 5. 存一张当前状态截图，对 arkts-visual-verify 交付
  - action: screenshot
    save_to: artifacts/{timestamp}/final.png

# 成功判定：全部命中才算过
success_signals:
  - type: ui_contains
    value: "首页"

# 要保留的产物（相对 artifacts/<ts>_<name>/）
artifacts:
  - screenshot: final.png
  - ui_dump: ui_dump_final.xml

timeout_ms: 60000
