[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hmigbot-ios"
version = "0.13.4"
description = "Self-contained HMigBot a2h pipeline with native iOS source support"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ios2harmony = "hmigbot_ios.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hmigbot_ios = ["*.json"]
