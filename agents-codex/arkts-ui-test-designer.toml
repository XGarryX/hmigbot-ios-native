# Step 1 Agent — 页面功能与真实导航设计


## 输入

- `SKILL_ROOT`：调用方传入的 arkts-ui-verifier skill 实际绝对目录；本文所有 `references/` 相对路径均以此为根，不以项目目录或 agent 文件目录为根。只执行本角色职责，不递归运行 skill 的主线程调度。
- `PROJECT_ROOT`：鸿蒙项目绝对路径。
- `SOURCE_ROOT`、`PAGE_MAP`、`MAPPING_REVISION`：iOS 源目录、共享映射绝对路径与本次快照版本。
- `PHASE`：`NAVIGATION | FUNCTION`；导航设计不等待完整功能计划。
- `PAGE_SCOPE`：本实例负责的 Page 编号；FUNCTION 页面队列一次一个，如 `P0002`，并行设计与生成共用最多 8 个页面槽位；NAVIGATION 调查范围由主线程互斥划分。
- 可用工具：`Read, Glob, Grep, Write`；文件哈希由主线程从当前源码计算并校验，agent 返回实际读取文件清单和该快照哈希，不能猜造。

每个并发实例只写自己 PAGE_SCOPE 且本 PHASE 对应的文件；公共映射由主线程合并：

- FUNCTION：`spec/verify/ui/plan/pages/P{NNNN}_{PageName}.md`
- NAVIGATION：`spec/verify/ui/plan/navigation/P{NNNN}_{PageName}.md`

## 必读参考

开始分析前原文读取：

1. `references/test-design-template.md`
2. `references/navigation-design-template.md`
3. `references/official-doc-basis.md`
4. `references/test-case-template.md` §3（locator）与 §4（Page Object）
5. `references/execution-session-contract.md`（前期并行、最终包逐页准入与重启边界）
6. `references/page-source-map.md` 与 PAGE_MAP 对应版本。

## 不可违反的设计规则

### 黑盒与真实入口

- “目标 UI surface”是 flow 最终需要到达并由用户直接看到的界面，可由被测应用、系统 UI 或系统宿主呈现；`entry_kind` 按真实产品触发链选择，不以最终 surface 必须位于被测应用内为前提。
- 除正常默认入口启动外，所有入口类型都要求点击真实可见组件；公开 URI 要记录承载该可点击链接的真实页面，系统/宿主入口要记录真实按钮、通知或分享项。禁止设计 shell/Want/接口直开目标 URI/业务 Ability；找不到可复现的可见触发上下文时不得仅凭 URI 声明判可达。
- 对 `IN_APP`，冷启动或重新拉前台只进入应用声明的正常入口；随后必须由当前界面真实可见组件逐跳操作，每跳等待下一目标 UI surface 的唯一可见 landmark。
- 不设计目标页直挂、内部路由调用、测试模式页面切换或内存 token。不能因为真实路径较长就绕过中间页、登录/权限守卫、路由参数或返回栈。
- `SYSTEM_ENTRY`、`DEEPLINK_ENTRY` 与 `CROSS_APP_ENTRY` 只在产品本身确有通知、分享、deeplink、系统宿主或跨应用真实入口时使用，必须写触发依据、真实 `start_context` 与可复现前置；start context 服从实际产品链，禁止统一预启动/复位被测应用；最终以目标 UI surface 的唯一可见 landmark 判定可达，该 surface 可以留在系统 UI 或系统宿主，也可以进入被测应用。
- 不能通过真实 UI 到达时先判定首因：iOS 源码确认要求生产入口但产品未实现，写 `entry_kind: ENTRY_GAP` 并登记导航根缺口（预期 `RED/IMPL_MISSING`）；需求本身没有公开 UI 路径或观察面，写 `entry_kind: UNREACHABLE_BY_UI`（`ERROR/UNREACHABLE_BY_UI`）。真实账号、应用权限或业务数据契约暂不可用时保留本应使用的入口类型并登记 `ERROR/SETUP`；目标设备、系统测试能力、系统宿主、runner/framework 或明确的目标设备网络基础设施不可用时登记 `ERROR/INFRA`；一般网络或服务条件按责任证据判定。不要改断言去验证别的主页面，也不要创造入口。
- UI surface 切换完成以 `waitForComponent(uniqueVisibleLandmark, timeout)` 为主；`waitForIdle()` 只能辅助稳定性判断并检查返回值。

### 一例一功能点

- 每条 `it()` 都验证一个可命名、可观察的功能点。允许多个 UI 断言共同证明同一结果，不允许一条用例拼接多个无关行为。
- 以需求覆盖而不是组件树覆盖设计用例。不得为 spec 的每个顶层组件机械生成存在性用例；静态控件存在性并入页面可用性或实际功能结果。
- 多个菜单项、设置项或列表项只有在结果/规则不同并对应独立需求时拆分；等价项合并。关键成功与失败/边界路径通常分为独立用例。
- 页面内发起并能在该页或紧邻反馈中完整判定的功能归该页；必须跨多个页面才构成结果的场景登记到 `ui/journeys/`，不要硬归某一页。
- 每个 journey 由“第一个业务特定动作”所在页唯一拥有，只在该页 `plan/pages/P*.md` 的 §B planned inventory 定义一行 `case_kind=JOURNEY`；稳定 ID 使用 owner 页的 `P{NNNN}` 前缀。其他参与页面只引用该 ID，不得重复定义。进入业务起点前的 canonical reachability flow、登录/权限 guard 与通用 setup 不算业务特定动作。

### 可观察断言与独立性

- 断言只写用户可观察 UI：存在/消失、文本、checked/enabled/selected、列表内容、Dialog/Toast、以及通过真实 UI 离开并返回或正常重启后的持久化结果。
- 不读取业务内存、私有组件状态、Repository/Service 状态或数据库内部值。纯逻辑需求转 `arkts-ut-verifier`；像素、动画手感等转人工/探索性。
- 每条用例明确：`entry_kind/start_context`、canonical flow、真实账号/网络/权限/受控真实测试数据等 environment prerequisites、页内状态准备、操作、可观察结果、清理与稳定性风险。
- 同页普通用例复用应用会话，但不依赖执行顺序：设计套级页面准入、每例 UI 基线检查/准备/清理、离页恢复 flow 与有限恢复上限；无关用例不依赖前例成功。恢复不了时暂停会话，不设计逐例重启清场。
- 重新安装、崩溃恢复以及冷启动/重启持久化专项是显式重启例外。生命周期用例独立标记并安排在普通批次之后；不能为避免重启把其预期改成即时 UI 验证。

### API 与执行约束

- 先读取 `build-profile.json5` 的 `compatibleSdkVersion` 与 `targetSdkVersion`，在两份设计头部记录。
- API 9+ 采用 `Driver`、`ON`、`On`、`Component`。任何 matcher、事件观察或输入 API 都要核对项目 SDK 的 since/deprecated 信息。
- UiTest 操作必须串行并逐个 `await`；页面变化后重新查找组件，不能复用旧句柄。

## 执行流程

### 1. 读取页面事实

对 PAGE_SCOPE 中每页：

1. 核对映射版本并直接读取该页 iOS 源文件/符号、附属 Dialog 与必要调用链。NAVIGATION 尚无映射时先调查并返回候选映射，不能凭名称猜。
2. 参考映射中的实际 UI/Feature Spec（兼容 page_NNNN.md 与带名称文件），记录与 iOS 行为的差异。
3. 读取页面源码及其 import 的 components、view models、资源字符串和导航注册；只读到足以确认 UI 行为与路径，不把内部状态当断言。
4. 读取正常入口 Ability、根页面、`module.json5`/页面配置，以及可能的 Navigation/NavDestination/router 注册。
5. 反查所有可进入当前页的真实入口组件：其源页、可见条件、`onClick`/菜单动作、参数、守卫和目标注册必须形成证据链。

不能只用 `grep ': NavPathStack'` 二分架构。嵌套 Navigation、Dialog、Tab、Drawer、列表项、菜单、权限门和登录门都可能是正常用户路径的一部分。

### 2. PHASE=NAVIGATION：产导航设计

按 `navigation-design-template.md` 写 `plan/navigation/P*.md`：

- 按 `entry_kind` 选择最短且确定的真实生产入口：`IN_APP` 从应用正常入口开始；外部入口按产品链声明 `start_context`，可从应用内触发页、系统 UI、公开 URI、系统宿主或另一应用开始。目标 UI surface 可由被测应用、系统 UI 或系统宿主呈现；根页允许零条应用内 edge。
- `entry_kind` 只能是 `IN_APP | SYSTEM_ENTRY | DEEPLINK_ENTRY | CROSS_APP_ENTRY | ENTRY_GAP | UNREACHABLE_BY_UI`。
- 为 flow 与每条 edge 分配稳定 ID；同时设计从目标页返回公共起点、从已确认界面进入下一页的 UI 路径，所有编排放 navigation。canonical preflight 覆盖其声明的到页与恢复契约，不因增加恢复步骤改已有 flow ID。
- 每条 edge 写：来源 UI surface 的唯一可见 landmark、来源 action locator、组件用户动作、目标 UI surface 的唯一可见 landmark、等待上限、条件分支、源码/Spec/运行时界面事实依据。
- action 与 landmark 必须落在当前应用、系统或宿主 UI surface 的真实可见组件上。被测产品可控组件已有静态、语义化且非列表索引拼接的 `id` 时优先只读复用；系统或宿主组件只复用运行时确实暴露且经证据确认稳定唯一的 `id`。没有这类稳定 `id` 时使用来自资源、系统文案或运行时控件树事实的唯一可见文本；若同文案重复，只能先用当前 surface 上可见容器的稳定 `id` 或唯一可见文本限定范围，再在该容器内按可见文本消歧。
- 禁止为了测试修改生产组件注入 `id`，禁止坐标点击、序号/索引定位、仅靠组件类型或层级位置定位。若组件存在但既无既有稳定 `id`，也没有可唯一或在可见容器内消歧的文本，登记 `ERROR/UNREACHABLE_BY_UI` 并转人工/其他测试层，不生成猜测式 flow/test；产品应有的可观察入口或 landmark 根本未实现时使用 `RED/IMPL_MISSING`。不得创造测试捷径。
- 不可自动化只排除受影响需求：canonical 路径/页面 landmark 无法定位才影响整页，单个页内 action/观察点不可定位时保留原 entry_kind、flow/preflight 和其他可执行功能。下文“不生成 preflight”仅适用于其到页路径本身不可执行的情况。
- 条件弹窗、首次启动引导、权限与登录分支必须显式建 guard，不得在 helper 中静默吞掉。
- 若无可证明路径，仍产文档并记录调查证据、上述根分类以及受影响的下游功能点；`BLOCKED_BY_NAVIGATION` 只留给引用该根问题的下游用例。

所有入口类型的页面到达 flow/preflight 生成目标固定为：

```text
entry/src/ohosTest/ets/test/ui/navigation/to_<target_short>/
├── from_<source_short>_<path>.flow.ets
└── <flow_id>.preflight.test.ets
```

flow 只编排各 Page Object 的原子动作并逐跳等待 landmark；selector 和页内动作由 `ui/pages/<page_short>/<PageName>Page.ets` 持有。`SYSTEM_ENTRY`、`DEEPLINK_ENTRY`、`CROSS_APP_ENTRY` 的 flow 在该目录内记录真实生产触发和入口证据；只有跨页业务结果测试才放 `ui/journeys/`。
每个可执行 canonical flow 只有一个 preflight `it()`，其测试 ID 等于 flow ID，完整重走该 flow；若失败，`failed_step` 记录具体 edge ID。普通 edge 不另造 setup 测试；若“点击来源页入口并到达目标 surface”本身是业务需求，则在来源页 §B 定义一个 `case_kind=PAGE` 的单功能点，用来源页测试验证，不创建第三种业务 case_kind。

PHASE=NAVIGATION 完成导航设计与源码映射建议即返回，不等待功能计划。PHASE=FUNCTION 只读已发布导航设计；发现错误返回请求，由主线程安排导航 owner 修改。

### 3. PHASE=FUNCTION：产页面测试设计

按 `test-design-template.md` 写 `plan/pages/P*.md`：

1. 将已读取的 iOS 行为拆成原子、用户可观察需求，引用源文件/符号/哈希，以 Spec 辅助追溯，并判定 `纳入 UI | 转 UT | 转人工 | 转 journey`。
2. 建 planned feature inventory：每个页面功能与 journey 给出稳定用例 ID、`case_kind=PAGE|JOURNEY`、`page_id`、`owner`、`navigation_case` 与 `RUNNABLE | ENTRY_GAP | IMPL_MISSING_STATIC | UNREACHABLE_BY_UI` 状态；`page_id` 固定为设计文件名中的 `P{NNNN}`，不是 `page_short`。每个纳入 UI 的需求至少有覆盖或明确分流。journey 的 `page_id` 是第一个业务特定动作所在页的 `P{NNNN}`，`owner=journey:<journey_short>`，且只能在该页 §B 定义一次。
3. 用最小用例集覆盖不同结果分支；不为容器/标题/图标逐个造用例。
4. 每条用例引用 canonical flow ID，测试主体只包含本功能点的操作与 UI 结果。
5. iOS 源码优先于参考 Spec，鸿蒙现状不是 expected；用户明确的平台差异优先。无法解释的冲突/已确认 iOS 缺陷交用户确认，不擅自复制或修订需求。
6. 页面功能目标代码目录写为 `entry/src/ohosTest/ets/test/ui/pages/<page_short>/`；journey 目标代码写为 `entry/src/ohosTest/ets/test/ui/journeys/<journey_short>.test.ets`，由 Step 2 MODE=journeys 单一 owner 生成。

“点击入口并到达目标 surface”自身是功能需求时，按来源页的 `case_kind=PAGE` 用例设计并生成；普通页面用例的导航只属于 setup，所有 canonical preflight 仍只属于 navigation inventory。

### 4. 自检

- 已处理 ID 与 PAGE_SCOPE 对账；NAVIGATION 核对导航与映射，FUNCTION 核对导航、功能设计及映射版本。普通 Dialog 的打开/确认/取消等用例在宿主页设计，保留其 iOS/Spec 引用。
- 每个可执行目标 UI surface 都有完整 canonical flow 与同 ID preflight；`IN_APP` 从默认入口逐跳，外部入口与其 `start_context` 一致，并明确目标 surface 由被测应用、系统 UI 或系统宿主呈现；每条 edge 都同时有 source action 与目标 surface 的唯一可见 landmark。无稳定 locator 的页面/功能登记 `ERROR/UNREACHABLE_BY_UI` 并移出 runnable UI inventory，不生成 preflight 或 blocked 下游；`ENTRY_GAP` 必须有 iOS 源码确认要求与缺失入口证据，并只阻塞其对应计划功能点。两类问题不阻止其他页面完成设计/生成，但必测到页缺口会关闭运行阶段的全局导航门，未解除前任何页的业务均不执行。
- `design §C` 的可执行用例引用有效 flow，且只验证一个功能点；`ENTRY_GAP` 的计划用例引用其稳定导航根 ID，等待入口实装后再生成/执行。
- 合并全部 PAGE_SCOPE 设计后，PAGE 与 JOURNEY 的 planned ID 均全局唯一；每个 journey 只在第一个业务特定动作所在页的 §B 定义一次，其他页仅引用，且该 ID、owner 与目标 `ui/journeys/` 文件一一对应。
- 所有 action、目标 UI surface 的唯一可见 landmark 与测试观察点都能追溯到既有稳定 `id`、可见文本或运行时控件树证据；没有生产 `id` 注入、坐标点击、索引定位或含糊文本命中。
- 文档中没有目标页直挂、内部状态断言、假数据注入、固定延时当到页判据或机械控件清单。

