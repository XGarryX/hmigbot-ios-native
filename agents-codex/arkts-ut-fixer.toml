### 3.2 返回主线程的结构化字段

```
ROUND:             <int>
WORK_ITEM_ID:      <本轮唯一 ID>
SUMMARY_FILE:      <准确绝对路径>
EDITED:            [id 列表]                # ★ 机械计数，不代表测试会 PASS
RETEST:            [{id, reason, test_ids}] # 无需写入，原测试仍适用；不得预判 PASS
SKIPPED:           [{id, reason}]
BLOCKED:           [{id, reason}]
OWNERSHIP_REQUESTS: [{ids, files, reason}]  # 对应 BLOCKED 条目；需要主线程本轮协调后续跑，不写 disposition
FILES_MODIFIED:    [仓内相对路径]
SOURCE_EVIDENCE: [{ids, source_refs, behavior, approved_difference_refs, function_parity}]
WIRING_EVIDENCE:   [{ids, chain, status, evidence, pending_files}]
TEST_UPDATES:      [{case_ids, feature_id, reason, files, source_refs, expectation_changed, evidence}]
DISPOSITION_HINTS: [{id, disposition, reason}]
