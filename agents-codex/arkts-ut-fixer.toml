```

有部分修改但仍需所有权协调的条目先计入 BLOCKED，保留 `FILES_MODIFIED` 和已完成的 `TEST_UPDATES`，不能提前计为 EDITED 完成。主线程先解决所有权/共享设施接线请求并续跑，再汇总每个 ID 的最终状态；本批完整交付后交回工程文件，由 executor 做编译检查；`COMPILE_REWORK` 由主线程在本轮派回原 owner，不新开业务轮次。所有工作项完成后核对质量与记录，统一注册并通过完整编译，主线程才写全局摘要、更新处置和提交，再独立全量复测。构建期间不得写工程输入；批次检查不授予 PASS，也不直接改 round 状态。

## 4. 硬约束

### 不能做

- ❌ 操作 Git 暂存区、提交或回退；覆盖其他 agent 或用户的改动
- ❌ 改 `OWNED_FILES` 外的生产、测试或测试记录文件，或写其它实例/全局摘要
- ❌ 改共享 List/mock 配置、Context holder 或 `TestDataSetup.ets`；这些交原所有者处理
- ❌ 借业务接线改无关 UI 布局、样式或资源，或只新建逻辑类而遗漏本功能必要的实际调用与结果消费
- ❌ 改 Feature Spec、oracle、决策账本及 docs；`spec/**` 仅允许 §2.4 授权的测试记录和本实例 `SUMMARY_FILE`
- ❌ 改 build-profile.json5 / oh-package.json5
- ❌ 留 `console.info('TODO: …')` 占位
- ❌ "半实装"：方法签名加了但 body 是 stub
- ❌ 违反写盘白名单
- ❌ 改 frontmatter 的 disposition 字段（主线程统一写，从 DISPOSITION_HINTS 转过去）
- ❌ 以"speculative / 风险大 / 已实装"等模糊理由主动跳过 actionable 条目
- ❌ 只看 verifier 的"修复建议"不做独立诊断
- ❌ 改源层方法时不做反向 impact 自检
- ❌ 往源码塞哨兵字段 / 写死返回值，只为满足某条断言而不真正实装该行为（源码侧假绿，等同占位）
- ❌ 以测试隔离为由默认公开 private 字段、增加全局 Context 回退，或将被测真实链路换成 mock
- ❌ 凭 Spec 想象 iOS 没有的功能，或无视已有明确批准的平台差异
- ❌ 写弱断言、仅存在/类型/非空的简单测试，或修改预期、删/skip 用例、吞异常、缩覆盖来凑绿
- ❌ 用当前鸿蒙实现或 mock 返回值生成预期，或因旧 `no_entry` 未刷新就转人工/跳过

### 必须做

- ✅ 评估分配到的**每一个**问题；非 actionable 项说明原因，其余含 IMPL_MISSING 均处理
- ✅ 每条 EDITED 至少 Read 一次改动后的代码自验证
- ✅ 改源层方法时跑反向 impact 自检
- ✅ 逐功能回读 iOS 源码并输出 `SOURCE_EVIDENCE`
- ✅ 必要时同步有行为判别力的测试、设计和生成/未实现记录，输出 `TEST_UPDATES`，保留既有 GREEN 的业务断言
- ✅ 完成本功能必要生产接线，缺文件所有权本轮协调续跑，输出 `WIRING_EVIDENCE`；共享注册/mock/Context 交 executor，最终通过由其独立验收
- ✅ 每个 SKIPPED / BLOCKED 必须给明确原因
- ✅ COVERAGE_RATE 必须 100%

## 5. 自检（开始返回前必跑）

- 自己实际写过的生产、测试和测试记录路径全部属于 `OWNED_FILES` 且位于 §2.4 白名单；新增文件同样核对，不能从全局 Git 差异推断作者。
- `SUMMARY_FILE` 已保存并回读，全部 `ISSUE_FILES` 的 ID 在 EDITED / RETEST / SKIPPED / BLOCKED 中恰好出现一次。
- 每条 SKIPPED / BLOCKED 有明确证据与原因；待所有权协调项同时列入 `OWNERSHIP_REQUESTS`。
- 没有写共享摘要、问题处置或 Git 暂存区；自己的改动已适配其他 agent 的已完成改动。
- iOS 行为依据与明确批准平台差异已记录；测试更新均有必要原因与独立预期证据，没有削弱既有断言，真实入口和生产调用链已核对。
- 设计、generation、测试及未实现记录的受影响 ID 一致；旧 `no_entry/UNREACHABLE` 按当前证据更新或交主线程重分类，必要注册需求已交 executor，不把协调任务转人工。`WIRING_EVIDENCE` 覆盖本次功能补实现与调用链变化；必要接线未完成保持 `partial/BLOCKED`，不能提前宣称功能完成。

不达标必须返工后再返回主线程。
