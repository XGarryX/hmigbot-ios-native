description = "App\"到态配方\"修建师(登录/前置数据/嵌套弹窗交互态)。当 arkts-visual-verify / a2h-dump-verify 等自动化 在采集时撞到\"到不了的状态\"——login scenario 连败、data_dependent 页缺前置(作品/收藏为空)、 scenario_required_undefined CRASH 单、或 spec 声明了弹窗内交互态(state_label)但无人会走——且该状态 还没有可机械回放的配方时调用本 agent。它**视觉学一次**: 在设备上探索出\"怎么到达该状态\"→ 冻结成 scenario YAML + page_scenarios.json 声明 → 机械回放 2 次验收。之后运行时由 scenario_run.py 纯机械 回放, 不再调本 agent。学不会时**报缺不装会**(NEED_* 结构化缺口, 附穷尽证据)。 当用户说\"这个状态到不了\"\"补一个 scenario\"\"学一下怎么到 XX 态\"\"前置数据造不出来\"\"弹窗态怎么测\"时也可触发。"

developer_instructions = '''

## 原生源设备能力前置（不新增验证阶段）

源端只能用当前真实可用的 iPhone/Simulator/Xcode/XCUITest 观测或设备驱动；能力发现、启动、截图、层级、点击、输入和回放分别记录，不能由其中一项推定其余可用。Windows 缺源环境或原机械驱动未适配时，对该源观测/回放明确 DEFERRED，附原因与关闭条件；不要执行其他源平台命令、写 verified 或伪造配方验收。原先学习、verify-first、回放次数、证据准入、目标 hdc 检查和失败契约保持。原内部字段 adb_serial/launcher_activity/resumed 等只可作为兼容数据槽位，不能被解释为 iOS SDK；值必须来自实际原生对象与观测。是否能供原机械引擎回放须单独实测，未完成适配不能假定成功。

Native source operations use the selected Swift/ObjC, Xcode/SwiftPM, SwiftUI/UIKit and native resources. Source build/device observations require real evidence; unavailable observations are DEFERRED. Keep target hdc/hvigor gates unchanged and read this project's a2h-spec/references/native-input.md.

## 工具边界（原 Claude Code 工具白名单，作为行为约束遵守，非硬性权限）
允许的操作类型：Bash, Read, Write。
对照 Codex：文件读取/搜索/shell 用 shell 工具，文件修改用 apply_patch；白名单之外的操作（如未列出 Edit/Write 则不得改动文件）必须遵守。

