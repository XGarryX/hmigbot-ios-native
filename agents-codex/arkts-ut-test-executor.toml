## 1. 测试基础设施与版本

先读 `references/mock-policy.md`、`references/test-case-template.md`；有模块替换需求时再读 `references/import-mock.md`。测试改动与质量门共同遵守 `references/fixer-test-policy.md`。优先复用项目已有 runner、fixture 与构建流程，缺什么补什么，不能把某个项目的模块名或 Context 初始化方式作为所有工程的固定要求。

- 核对 `oh-package.json5`、锁文件与安装包声明中的 Hypium 实际版本，以及 SDK API、Stage 模型、编译模式。1.0.25 的实例私有 mock 与 1.0.28 的新断言/匹配器按版本使用，不自动升级已有依赖。
- 若缺 Hypium 依赖，选择与当前 SDK 及实际用例 API 相容的已确认版本，加入 devDependencies 并同步；不要固定回填旧的 1.0.21，也不要直接把 master 当发布版本。
- 从项目配置和构建结果读取主模块、ohosTest 模块、Ability 名及 HAP 路径。下文 `entry/entry_test` 为示例，执行时替换为实际值。
- `ohosTest` target 缺失时按工程结构补齐。只生成测试需要的资源与 Ability；纯逻辑和仅需应用 Context 的用例不额外要求启动测试页面。

最小目录：

```
entry/src/ohosTest/
├── ets/testrunner/OpenHarmonyTestRunner.ets
├── ets/test/{List.test.ets, ut/}
├── mock-requests/F*.json                  ← 生成阶段独占产物，无模块替换时 entries 为空
└── module.json5                          ← 复用匹配当前 SDK 的测试模块配置
entry/src/mock/
├── mock-config.json5                     ← executor 单点合并
└── ut/F*/                                ← 生成阶段独占的必要 mock 实现
```

### 1.1 Runner 与 Context

没有 import mock 或 Ability 前置条件时，最小 runner 可为：

```typescript
import { abilityDelegatorRegistry, TestRunner } from '@kit.TestKit'
import { Hypium } from '@ohos/hypium'
import testsuite from '../test/List.test'

export default class OpenHarmonyTestRunner implements TestRunner {
  onPrepare() {}
  onRun() {
    const delegator = abilityDelegatorRegistry.getAbilityDelegator()
    const args = abilityDelegatorRegistry.getArguments()
    Hypium.hypiumTest(delegator, args, testsuite)
  }
}
```

已有 runner 的必要初始化与项目逻辑要保留。Preferences/RDB 要求有效 Context；优先真实 `delegator.getAppContext()`，不能仅凭其类型判无效。出现 401 时核对 API 入参、Context 生命周期、所属模块与存储路径。

仅当设计/目标 API 确需 UIAbilityContext 时：

1. 单点创建 `test-case-template.md §2.4` 的测试侧 `TestContextHolder`。
2. 复用或创建声明在实际测试模块中的 TestAbility，在 `onCreate` 设置 `TestContextHolder.abilityContext = this.context`，`onDestroy` 清空。直接导入同一 holder，不向业务代码加入 globalThis 回退。
3. 用与 module.json5 完全一致的 bundle/module/ability 名构造 Want。若用 callback 启动，失败时 reject 并报告具体错误；不能无论成功失败都 resolve。
4. await 启动完成，并 await `TestContextHolder.resolve(true)` 后执行用例。等待超时应明确失败；不能继续使用尚未初始化的对象。
5. 仅需窗口时补测试页面、profile、图标与相关资源，保持声明路径一致。

存储 fixture 使用测试独占资源，调用链实际访问哪个后端就初始化哪个；测试结束关闭/flush/清理。初始化错误优先修测试前置条件，不改变生产行为。

### 1.2 import mock 的合并与接线

生成 barrier 后，根据本轮设计与测试集合读取 `entry/src/ohosTest/mock-requests/F*.json`，排除过期请求。按 `references/import-mock.md` 单点合并开发配置 `entry/src/mock/mock-config.json5`，检查已有用户配置、同 target 多实现以及真实调用链被替换的冲突。无替换需求不自动生成系统 mock。

- 按兼容映射划分运行组；临时切换配置需保留原配置并在结束或失败时恢复。每组配置、构建 HAP、测试清单和日志一一对应。
- 优先保留 DevEco/项目已生成的 mock 初始化。核对源 JSON5 经构建后得到的配置资源与模块路径，不假设 `mock/mock-config.json` 总存在或其值仍是源文件路径。
- 自定义 runner 确实缺初始化时，才按实际产物接 `setMockList(Record<string, string>)`；初始化必须早于被替换模块首次加载，包括 runner、TestAbility 和 helper 的传递依赖。
- 如果静态导入会过早加载目标，将测试套改为映射注册之后的动态 import；不能先启动会加载该依赖的 Ability，再注册映射。
- 不硬编码 `createModuleContext('entry_test')`、rawfile 路径或盲目把 `cfg[k].source.toString()` 作为运行时映射。
- 用真实焦点调用确认边界替换确实生效，检查各消费者需要的导出；不能只断 mock 自身返回值就计业务 GREEN。
- 测试配置或初始化失败不得静默回落真实外部 IO。先修接线；仍失败则记测试基础设施 ERROR，不改生产源码。

`MODE=register` 处理 List 与最终 mock 请求的合并；若为防止模块提前加载而需按运行组调整测试入口，由 executor 做不改变断言语义的入口调整，保留原注册并在本轮结束后恢复。每个设计用例在适用运行组中都必须有结果或明确缺口。

