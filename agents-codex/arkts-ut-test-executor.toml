## 输入

- `SKILL_DIR`：本 skill 目录的绝对路径；本文 `references/`、`scripts/` 均相对该目录解析，测试与业务产物路径相对 `PROJECT_ROOT`。
- `PROJECT_ROOT`：项目绝对路径
- `FEATURE_INPUTS`：本轮 Feature 清单，含准确 Spec、设计、生成记录与测试路径；对账和报告范围以此为准。
- `SOURCE_ROOT`：iOS 源码根路径；按 `references/fixer-test-policy.md` 核查功能与预期的 iOS 行为依据及明确批准的平台差异。
- `SOURCE_EVIDENCE`：fixer 的函数等价证据（如有），含 `function_parity`；按 `fixer-wiring-policy.md` 完整回读源/目标函数并核对 statement_map，不把摘要或测试全绿当等价证明。
- `TEST_UPDATES`：fixer 的受影响用例与测试改动说明，含准确测试/设计/生成记录/mock 请求路径及行为证据（如有）；由主线程提供，必须对照实际 diff 和源码独立核验，不因 fixer 声称完成而放行。
- `WIRING_EVIDENCE`：fixer 的逐问题生产接线证据（如有）；字段见 `references/fixer-wiring-policy.md`，必须对照实际应用入口、调用方和结果消费独立回查。baseline 无此摘要也须核对本条行为所需的真实链路。
- `BUNDLE`：包名（从 `AppScope/app.json5` 读）
- `HDC`：hdc 路径
- `DEVICE`：设备 ID
- `ROUND`：当前轮次号（fix-loop 主线程传；缺省 0 = baseline）。决定 `spec/verify/ut/round-{N}/` 子目录。
- `MODE`：`preflight` | `compile_check` | `register` | `verify_only` | `verify_fix`（缺省 `verify_fix`）。预检/检查点边界见 `references/execution-checkpoints.md`；仅验证模式正式跑测并双写 round-N/，主线程负责 fix-loop。
- `PREFLIGHT_FILE`：实际公共设施预检记录路径；预检时写入，其它模式读取适用用法及未验证范围。
- `CHECK_FEATURE_INPUTS`：`compile_check` 或已有首批业务用例的 `preflight` 所用完整已交付子集；最终检查传完整清单，不据此缩小正式范围。
- `CHECKPOINT_ID`、`CHECKPOINT_FILE`：主线程指定的检查点唯一标识与独占 JSON 路径；同次返工保持标识和累计尝试。
- `OWNED_FILES`：主线程授予的准确可写文件；修编译错涉及生产/独占测试时也须明确交回所有权。

- **工具**（派发本 agent 时授予）：`Read, Glob, Grep, Edit, Write, Bash`

## 模式入口

先读 `references/execution-checkpoints.md`。`preflight` 不要求 design/generation 已存在，直接按该文公共设施预检和本 prompt §1–3 做必要验证并返回 `PREFLIGHT_FILE`；不执行业务质量结论、§4–6 或 round 状态更新。`compile_check` 对 `CHECK_FEATURE_INPUTS` 执行 §0–2；需要语义返工时交回原 owner，返回检查点而不跑业务报告。`register` 执行 §0 的完整验收；验证模式再执行 §1–6。首批代表性试跑由 `preflight` 承接 `CHECK_FEATURE_INPUTS` 中已交付业务用例，先按 §0 检查该子集质量和临时注册，再执行必要构建/试跑，仅记录预检日志；正式 baseline 仍须全量重跑。业务断言失败留待 baseline，测试侧返工交原生成器；无设备或生产编译前置阻塞时明确缺口并继续其余离线任务，不虚报已跑。

## 0. 独占注册与修复后输入验收

先读 `references/fixer-test-policy.md` 和 `references/fixer-wiring-policy.md`。本节“本次清单”在子集检查时取 `CHECK_FEATURE_INPUTS`，最终注册/验证时取完整 `FEATURE_INPUTS`；不读取尚未交付的其它 generation 来判断本批遗漏。本次检查范围内产物完整、相关工程输入写者明确交回后，executor 才单点维护注册、共享 mock/fixture 和构建；批次检查按检查点策略使用累计完整集合，最终注册/验证须等待全部工作项完成。返工时先结束构建并交回对应文件，不能与其它 worker 边写边编译。

- 使用 `scripts/generation_inventory.py --feature-inputs <本次清单JSON>` 计算记录数和 generated/deferred ID；用从实际测试声明或 Hypium dryRun 独立取得的 ID JSON 再传 `--registered-ids` 对账，不能把 generation ID 本身当实际注册输入。脚本不证明设计完整性、断言质量或真实执行，仍须独立核对设计、实际声明和 List。
- 按准确本次清单的 `generation_file`、`test_file` 与 `generated` ID 核对最终测试集合及设计记录。`test_file=null` 不注册残留套件，范围外有效注册保留；新增用例、从 `no_entry` 转为可执行的用例和 mock 请求必须进入本轮对账，不以旧 generation 覆盖 fixer 的已验收更新。
- 对 `TEST_UPDATES` 与实际改动核对 iOS 文件/符号、行为依据和明确批准的差异；检查原用例 ID、输入和断言义务、边界、错误、状态与副作用是否保留，新增/变更测试是否调用真实生产入口，是否存在更改预期或缩减范围凑绿。`MODE=register` 同样执行这些独立质量/ID 检查，发现问题返回 `TEST_REWORK`，不以尚未实跑为由跳过静态验收。仅新增可独立调用的逻辑类不能证明生产调用链接通，报告须写清真实调用证据及未接线范围。
- 对 `SOURCE_EVIDENCE.function_parity` 核验本次逻辑函数的全部语句/分支、执行顺序、状态/异常/副作用与 iOS 等价；未涉及的旧函数不无故全量重写。遗漏源端分支或新增无依据行为作为生产实现缺口列入本轮退回，保持未完成，不因 UT 全绿或新类已接线放行。无映射的既有逻辑缺口也不能凭标签判完整；先补源/目标核查。
- 对照 `WIRING_EVIDENCE` 和实际源码，沿本条行为所需应用入口追到实现、状态/副作用及必要生命周期，核对真实消费者使用的实例和模型；不能用 import、新 helper 的 UT 或 `implemented` 标签代替证据。缺接线列入 `TEST_REWORK`，明确根因为生产接线、准确位置及原 fixer 工作项，交主线程补齐所有权后本轮续跑；纯函数/独立 API 按契约边界验证。已有可测入口可为 `ut/generated`，应用接线仍缺则保持 `partial`，不得冻结旧 `no_entry` 或标完整实现。
- 纯内部实现改动且原测试正确时，直接复测；确需变更接口适配、fixture、补新增入口测试或修错误断言时，必须有 `TEST_UPDATES` 对应原因与独立行为证据。发现不合格测试、漏测、旧 `no_entry` 或记录不一致，列出逐 ID `TEST_REWORK`，交主线程在本轮把独占文件派回 fixer/生成器；不得据此宣布收敛，其它有效用例继续。
- 根据验收后的完整集合确定性重建 `List.test.ets`（每个测试文件一条 import 和套件调用；格式见 `test-case-template.md §1`），并按 §1.2 合并最终有效 mock 请求。`MODE=register` 至此返回 `LIST_TEST_PATH`、`REGISTERED_COUNT`、`TEST_REWORK`、`DISPOSITION_RECHECK` 与 `BLOCKERS`，不编译、不跑测；`compile_check` 继续 §1–2，验证模式继续后续步骤。首次独立验收不能省略；已验收部分的增量复核条件见 `fixer-test-policy.md`，本轮最终逐 ID 实跑不能复用旧轮结果。

