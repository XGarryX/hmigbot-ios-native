## 4. 解析结果

先读取主线程指定的本轮 Feature 清单（含 `ac_inputs/addendum_files`）、准确设计文件及 `spec/verify/ut/generation/F*.json`，按 ID 核对：逻辑设计总数 = `generated + no_entry + needs_review`，UI AC 另计。每条 generation 的 `source_ac_ids` 须与源 AC 和设计追溯一致；旧记录缺映射时交原 owner 按已有稳定 ID 补齐，不能凭当前复选框次序发号。测试文件中的 `it()` 集合须与 `generated` 集合一致；遗漏可执行行先交生成器补齐，不能算成授权跳过。未生成记录没有设备执行结果，不得计为 Pass、Ignore 或真实运行失败。

`no_entry/needs_review` 的设计分类由本步按当前源码与环境复核：测试接线/Context/共享 fixture 问题先修复，用例代码问题进入本轮 `TEST_REWORK`。已有入口且行为证据完整时，要求 fixer/生成器补测试并同步设计与 generation 后重新注册执行，不能冻结旧记录继续报缺失。确认缺少生产能力且 iOS 源码/批准差异有充分依据时，写 `IMPL_MISSING` 并保持可派发状态，交主线程分配实现与必要补测；不能仅因当前无 UT 入口置人工复核。确实超出本验证范围的可执行性缺口才写 `UNREACHABLE`，具体证据不足的行保留 `needs_review` 并说明待核实内容。iOS 暂不可读不阻断已有测试或已核验证据支持的用例；禁止按 Spec 猜造新功能或预期。分类数、实际执行数与结果数分别报告。

必读 `references/result-statistics.md`，逐运行组执行 `scripts/hypium_results.py parse --log <RUN_LOG> --expected-ids <GROUP_REGISTERED_IDS>`，保存 JSON 和退出状态。官方状态码为 `1=开始、0=Pass、-1=Error、-2=Failure、-3=Ignore`；开始事件不计结果，Ignore 不算验证通过。按稳定 ID 对账开始/结束、实际清单和汇总，`Tests run` 包含 Ignore，不能推算 Pass。日志格式不支持、缺失/重复 ID、计数不一致或没有完成标记时保留诊断，先修复基础设施或补跑；无效日志组不能提供已验证结论。

质量门后按该参考保存全量设计与运行组证据并执行 `hypium_results.py metrics`，分别报告 `RAW_PASS_RATE`、`DESIGN_VERIFICATION_RATE`、`AC_COMPLETION_RATE`。逻辑设计分母包含未生成、未执行、Ignore、编译跳过和假绿；AC 按源稳定 ID 统计且要求全部用例义务与必要生产接线完整。零分母为 N/A，三个比例不相乘。代码覆盖率仅按实际插桩报告另列，未采集不得称为已测量。

> 设计阶段不再预测红绿（无 EXPECTED_GREEN/RED）；红绿完全由本步实跑测量，且要先过下面的假绿门。

---

## 4.1 GREEN 质量门（计入设计验证与 AC 完成比例前必跑）

实跑 GREEN ≠ 真 GREEN。计验证比例前，对**每个 GREEN 的 `it()`** 按 `test-case-template.md §3` 定位候选并结合契约、真实调用链复核；确认断言不验证焦点行为才判**假绿**，保留原始 Pass 及设计分母：

此外，方法 UT 的真实 GREEN 只证明其断言范围。本功能所需生产接线缺失时，保留原始运行结果，功能实现状态仍为 `partial`，不计该功能完整实现；列出接线位置和本轮返工目标。按 §6 为受影响稳定 ID 保留有 iOS 依据的 `IMPL_MISSING` 问题，已有调用但行为错误按 `RED`；不能仅因方法测试通过省略问题文件。

新增与修改的测试还须独立核对 `TEST_UPDATES`：iOS 依据/批准差异是否支持预期，原断言义务及必要边界、状态、错误和副作用是否保留，测试是否能识别至少一种合理错误实现。短测试可以合格；无实质业务断言、删除失败用例、放宽误差/条件、只断数量替代内容、吞错或自 mock 自断均不能凭运行通过放行。

```bash
# 在 entry/src/ohosTest/ets/test/ut/ 下扫弱形状（示例信号，按需补全）
grep -nE "assertInstanceOf\('Function'\)|typeof .*===|Reflect\.has\(" entry/src/ohosTest/ets/test/ut/F*.test.ets
# 复核：解析/映射是否仅断条数；是否替换了焦点本身并自断；是否触达真实焦点
# 合法计数契约、真实焦点返回/转换依赖 fixture 的值，不因形状或同值自动判假绿
```

**source-oracle 溯源回校**：对每条 `// oracle: <path>:<line>` 注释，先用脚本检查直接字面量/符号，再核对源码行为、版本与推导依据；不能以行号附近出现同值替代语义核验：
```bash
# 对每个带 oracle 溯源的断言（path/line/期望字面量）：
读取 <path> 的 <line> 行及上下文，核对源证据与期望；漂移后重新分析而非机械改行号。
# 返回 FAIL → 回核版本、符号与推导；可能是行号漂移或计算结果，不能直接判伪造或弱化断言
```
溯源可以修正且行为依据明确时，列 `TEST_REWORK` 由文件 owner 修注释/记录；不能静默改预期。行为依据仍不足时，从充分验证统计中剔除该项，标明 `needs_review` 和具体缺证据。`golden-degraded` 不授权宽松断言：只统计已获独立证据支持的断言范围，未证明的行为明确列缺口。

确认假绿的用例：**从真 GREEN 中剔除**，按 RED 写进 `spec/verify/ut/round-{ROUND}/ut/<id>.md`；新问题保持 `disposition: null`，旧处置按 §6.2 交主线程复核，均列 `TEST_REWORK`。§3 写“假绿：<弱断言及未验证行为>”，§4 指向测试文件，§5 要求根据 iOS 行为/批准差异重写强断言。fixture/mock 用法等测试缺陷写 `ERROR` 并同样退回本轮修正。主线程为 fixer 或生成器分配独占测试文件，executor 收回结果后重新独立验收与执行；不能因“fixer 不修测试”置 `manual_review`。

> 上一轮 GREEN 本轮被质量门首次标红是测试质量发现，报告应区分源码回归。测试修正仍属于自动处理未完成项，不能通过改变分类、跳过注册或清空可派发队列宣告收敛。executor 不自行改焦点断言以凑绿；只有真实缺证据、待用户决策或明确批准跳过等符合规则的原因才进入对应处置状态。

