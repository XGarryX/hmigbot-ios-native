## 2. 编译双 HAP（每运行组最多 10 次尝试）

按 `execution-checkpoints.md` 累计构建尝试并在当前 round 处理编译错误：无行为变化的修正由获授权 executor 完成；需要业务/fixture/断言判断时返回 `COMPILE_REWORK` 给原 owner。不能首次 build 失败便写下一轮派单；返工后重验受影响质量与接线。最终提交前必须完整双 HAP 编译通过；实跑前只有输入及各组 HAP 指纹仍匹配时才复用编译。

下面路径为 entry 工程示例；先解析实际模块名与产物路径。多运行组逐组编译、安装并运行对应配置，防止误用上一组的 HAP。

```bash
hvigorw assembleHap --mode module -p module=entry@default  -p product=default --no-daemon 2>&1
hvigorw assembleHap --mode module -p module=entry@ohosTest -p product=default --no-daemon 2>&1
```

修编译错的红线：

| 允许 | 禁止 |
|---|---|
| 改基础设施文件（TestRunner/TestAbility/module/资源） | 改测试断言语义（`expect/assertXxx` 实参） |
| 获授权的主源码只修可证明等价的声明/类型收窄；不能强转掩盖类型错误、吞异常或丢失错误 code/message | 删 `it()` / 删 `await` / 改 describe·it 命名 / 删 beforeEach 体 |
| 测试文件结构性修复（对象字面量改 `new`+赋值、嵌套函数提到 describe 外、`null` 收窄加 type guard） | 把真断言降级成占位 |

某测试文件连续 2 轮修不过且只能动断言语义 → 明确记录 `skipped-compile` 缺口和 `TEST_REWORK`，由主线程在本轮派 fixer/生成器修正；executor 可临时撤下该文件注册以继续其它 Feature，修复后必须恢复并复测。未执行项不计通过率运行分母，仍保留在设计缺口和未完成统计中，不得通过跳过获得收敛。双 HAP 都 `BUILD SUCCESSFUL` 才算过。

