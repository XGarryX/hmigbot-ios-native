## 5. 写报告

单文件 `spec/verify/ut/ut-report.md`，内容：

- 实际 Hypium 安装版本、SDK API、Stage 模型与编译模式；文档来源与版本条件
- 构建结果（各运行组的双 HAP 是否 SUCCESSFUL）
- 依赖证据表：用例ID / 真实链路 / 替换点或无 / 必要原因 / 模块映射与运行组 / 清理结果；分清真实持久化、模拟错误响应与未验证的外部能力
- 原始数字：`Tests run / Pass / Failure / Error / Ignore`
- 设计与生成对账：逻辑设计总数、已生成数、`no_entry`、`needs_review`、另列 UI AC 数；未生成项附 Spec、入口证据及原因，不能隐藏覆盖缺口
- **测试数量更新提醒**：每次新增独立测试用例（新的用例 ID / `it()`）后，按最新设计、generation 与实际测试集合重新统计报告总数，确保新增项计入已生成测试总数；新增设计点同时计入逻辑设计总数，原 `no_entry/needs_review` 补成测试只转换分类，不重复增加设计总数。仅完善已有用例断言不增加用例数，同一用例重复执行不重复计数。`Tests run / Pass / Failure / Error / Ignore` 仍取最新对应运行日志，未执行新增项列为待验证，不手工增加运行数或通过数。
- 测试更新验收：`TEST_UPDATES` 对应的实际文件/用例变更、iOS 行为及批准差异依据、保留的断言义务、新入口补测与生产调用证据、尚待本轮修正的 `TEST_REWORK`；未执行新增测试不得报告已验证
- 原始通过率、设计用例验证比例、逻辑 AC 完成比例，均列分子/分母与范围；按 `result-statistics.md` 计算。代码覆盖率另附真实插桩报告，无报告写未采集
- 逐 Feature 结果表：用例ID → GREEN / RED / ERROR / skipped-compile，RED/ERROR 附失败首行原因
- RED 清单（Top 10）
- **oracle 来源分布**：分别统计 iOS 源码/已核实 oracle、明确批准的平台差异、尚缺行为证据的项；已有 `spec散文` / `golden降级` 标签须说明实际证据状态，不能当成允许弱断言的来源。列溯源回校失败及语义复核结果。**说明验证范围**：oracle 不自动证明额外生产调用链；golden-degraded ≠ 已覆盖，partial 逐项列缺口。跨模块/system/native 不按名字判不可达，按实际执行证据说明。

报告基于**真实运行日志**，禁止在未连设备时编「预测报告」。每个运行组单独保留日志；同一用例重复执行只计一次覆盖，保留全部相关结果，不能用某组 PASS 遮盖另一适用组的失败。

