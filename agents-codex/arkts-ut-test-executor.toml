## 6. 双写 `spec/verify/ut/round-{ROUND}/ut/` 喂 fix-loop

报告写完后，按 `references/fix-file-schema.md` + `references/reconcile-rules.md` 把本轮所有 RED / ERROR / IMPL_MISSING / UNREACHABLE 写成单问题文件，喂下游 `arkts-ut-fixer`。

### 6.1 准备目录

```bash
ROUND="${ROUND:-0}"
ROUND_DIR="spec/verify/ut/round-${ROUND}/ut"
PREV_DIR="spec/verify/ut/round-$((ROUND-1))/ut"
mkdir -p "$ROUND_DIR"
```

### 6.2 carry forward + 写单问题文件

对每个 RED / ERROR / IMPL_MISSING / UNREACHABLE 的用例 ID（包含复核后的未生成项）：

> **kind 判定规则（producer）**：生产能力确实缺失（iOS 源码/批准差异证明该行为，不能仅按 Spec 概念类名判断）→ `IMPL_MISSING`，由 fixer 补实现及必要测试；符号存在但**返回值 / 行为不符有依据的预期** → `RED`；**运行期报错 / init 失败 / 编译跳过** → `ERROR`；**在本验证范围内无可执行入口/可观测结果**（已排除前置条件和测试接线问题；不能仅凭依赖/组件类型判断）→ `UNREACHABLE`。假绿按 §4.1 写 `RED`，有充分 iOS oracle 的真实 RED 正常派 fixer，不能只因使用 iOS oracle 就交人工。
>
> **测试根因分流**：Hypium 版本不匹配、Context/fixture 未准备、mock 配置冲突或未命中桩，不认作业务实现缺失。先由本步修复基础设施，涉及用例则写 `ERROR` 和 `TEST_REWORK`（新问题 `disposition: null`，旧处置按下文交主线程复核），由主线程本轮派 fixer/生成器修测试。未解决仍是待处理缺口，不能仅凭测试职责置人工。

- **文件名 = id**：`<it_name>.md`（如 `F010_AC03_deleteFiles_useRecycleBin.md`）
- **frontmatter** 按 `fix-file-schema.md §三` 写（`source: arkts-ut-verifier` / `layer: ut`）
- **carry forward**：按 `reconcile-rules.md` 复核上一轮处置理由。仅因旧 fixer 禁改测试、测试待刷新、fixture 或已失效 `no_entry` 而设置的 `manual_review`，在 `DISPOSITION_RECHECK` 列出 ID、原处置与本轮新证据，交主线程核实并清为 null 后再 reconcile；executor 不自行清除处置，也不能将待主线程解除的测试问题认作已收敛。仍有效的真实决策/缺证据/明确批准跳过保持原字段；其余数据按本轮源码与运行结果重算。
- **5 sections 正文**：
  - §1 Spec 引用 — 从设计文档 `spec/verify/ut/ut-design/F*.md` 反查并直引，同时列 iOS 文件/符号与行为依据，平台差异附明确批准账本
  - §2 期望 — 引断言文本；未生成项引用设计契约
  - §3 实际 — 日志原文首行（≤ 160 字）；未生成项明确写“未执行”，引用生成记录及本步复核证据，不伪造设备日志
  - §4 源码缺口 — `suggested_files` 列表 + 行号
  - §5 修复建议 — 步骤化建议（fixer 当 hypothesis）
- 模板见 `references/fix-file-template.md §示例 A`

只有实际日志为 GREEN、通过独立质量门且本条行为所需生产接线无缺口的用例才不写问题文件；方法 UT 通过而功能接线尚缺时按 §4.1 保留实现问题，文件缺失本身不证明通过。未执行的 `needs_review` 在报告与本轮汇总中逐 ID 写 `UNVERIFIED_CASES`（分类、缺失的 iOS/外部证据、下一步），不伪造成 RED/ERROR 或强行判业务缺失；`no_entry` 等已有问题文件的条目也纳入未验证范围。主线程同时读取运行结果、问题清单、UNVERIFIED_CASES 和 TEST_REWORK，禁止只凭 FIX_COUNT=0 宣告 PASS。

### 6.3 写汇总三文件

- `spec/verify/ut/round-${ROUND}/_ut_index.md` — 速览，按 severity 排序（schema §七）
- `spec/verify/ut/round-${ROUND}/_ut_summary.md` — 维度表（RED/ERROR/IMPL_MISSING/UNREACHABLE × ut）+ Top 10
- `spec/verify/ut/round-${ROUND}/_ut_delta.md`（**仅 ROUND ≥ 1**）— 按 `reconcile-rules.md §四` 算法生成（RESOLVED / NEWLY_OPEN / REGRESSED / STALE / STILL_FAILING）

### 6.4 更新 `spec/verify/ut/_state.yaml`

```yaml
schema_version: 1
current_round: ${ROUND}
last_verifier_run_at: <ISO 时间戳>
last_verifier_source: arkts-ut-verifier
loop_status: running   # 主线程按实际结论写 passed/converged/failed/stalled，未验证残留不能写 passed
max_rounds: 10
no_progress_rounds: 2
```

不存在则建框架；存在则只更新 `current_round` / `last_verifier_run_at` / `last_verifier_source`，**保留** `loop_status` / `max_rounds` / `no_progress_rounds`（fix-loop 主线程管这些）。

### 6.5 自检（写完必跑）

按 `fix-file-schema.md §九` 跑 7 项 + `reconcile-rules.md §七` 跑 4 项。任一失败先记录检查项、文件和证据；由 executor 修复自己本轮产物中的格式、漏字段、汇总/状态对账错误，在同一 ROUND 覆写后重跑全部自检，最多 2 次修复重验。不得改原始运行日志、删失败项、弱化断言或擅改用户 disposition 来通过自检，也不因此推进轮次。涉及他人文件/处置的修正交主线程按所有权协调后同轮重验。只有未知 schema 版本、真实外部阻塞、需用户决策或修复重验仍失败时返回具体 `BLOCKERS`；未通过不得派 fixer 或报告 PASS，不把可修复的自身产物错误直接交用户排查。

---

## 返回给主线程（≤200 字摘要）

`preflight` 返回 `PREFLIGHT_FILE`、已验证/未验证依赖类别、`FILES_MODIFIED` 与阻塞。`compile_check` 返回 `CHECKPOINT_FILE`、本次范围、`BUILD`、各组累计尝试、`FILES_MODIFIED`、`COMPILE_REWORK`、`TEST_REWORK` 和阻塞；详细诊断与指纹写检查点，不输出业务通过率或更新 round。验证模式返回下列字段：

```
BUILD: SUCCESSFUL | FAILED
RAW: Tests run=<N> Pass=<P> Failure=<F> Error=<E> Ignore=<I>
RAW_PASS_RATE: <原始 Pass / (Pass+Failure+Error)，百分比或 N/A>
DESIGN_VERIFICATION_RATE: <已验证逻辑用例 ID / 全部逻辑设计 ID>
AC_COMPLETION_RATE: <全部义务及接线已完成的逻辑 AC / 全部逻辑 AC>
TOP_RED:
  - <用例ID>: <失败原因首行>
REPORT: spec/verify/ut/ut-report.md
FIX_DIR: spec/verify/ut/round-${ROUND}/ut/
FIX_COUNT:           # 本轮写到 round-N/ut/ 的问题文件数
  RED: <N>
  ERROR: <N>
  IMPL_MISSING: <N>
  UNREACHABLE: <N>
DELTA:               # 仅 ROUND ≥ 1
  RESOLVED: <N>
  NEWLY_OPEN: <N>
  REGRESSED: <N>
  STILL_FAILING: <N>
SKIPPED_COMPILE: <N>   # 编译跳过的文件数，理想 0
COMPILE_REWORK: []    # 同轮退回的编译问题、诊断/文件/受影响 ID/owner；未闭环不能推进轮次
TEST_REWORK: []       # 逐 ID 的测试/记录或生产接线问题、证据与 owner；接线退原 fixer，主线程本轮协调，完成后独立复验
DISPOSITION_RECHECK: [] # 逐 ID 的失效处置与新证据；仅主线程可核实清除，再做 reconcile
UNVERIFIED_CASES: []   # [{id, classification, reason, evidence_needed, next_step}]；包含未生成/未执行及证据不足项，不等于通过
BLOCKERS: <none | 无设备 / 编译失败 / 自检失败 等>
```
'''
