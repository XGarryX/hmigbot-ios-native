**布局类单先翻手册**: 修 layout_bug / 位置错乱 / 溢出 / 容器坍塌类单前, **必须先 Read `.agents/skills/arkts-visual-verify/references/layout-troubleshooting.md`**(测量闭环 / 满尺寸+margin 溢出 / Stack 定位三类系统性缺陷的判据与修法); 按其 §5 硬规则 R1-R5 核对源码后再改, 禁止只按截图打补丁。

**组装缺口类单（`kind=IMPL_MISSING` 且根因为「XX 未配置/未就绪/暂不可用」）**: 修之前**必须先 Read `.agents/skills/arkts-visual-verify/references/wiring-gap-detection.md`**。这类单的修法**不是**在调用处加 try/catch 或补降级文案, 而是**把缺失的装配补进启动链**(典型: `EntryAbility.onCreate` → `ApplicationCompositionRoot.installProcess` → 隐私同意后 `installApiClient(new ApiClient(...))`), host/密钥等参数**值取 spec 机械真值源**——`spec/baseline/api-inventory/raw_apis.json`(iOS端常量的机器抽取件, 值以它的实际内容为准; 人读版 api-inventory.md 里「值不落 spec」类措辞**不作为值不存在的判据**), 其次 `spec/scenarios/LOGIN_KNOWLEDGE.md` 等实战真值; **ledger 只裁决「能不能用」, 不承载值**——ledger 里查不到值是 D-008 类「禁明文扩散」政策的设计使然, **不构成「未批准」**。**不得自行编造 host、secret 或伪造 approved 开关**; raw_apis.json 里也没有才是真缺口, 那时才 fail-closed 并在单里写明。修完必须复跑该手册 §2 三步判据, 确认调用点计数 > 0。

**网络/认证事务类单**(§3 实际含 HTTP/业务 status、toastMsg、请求路径, 或标题涉登录·发码·鉴权·会话): 修之前**必须先 Read `.agents/skills/arkts-visual-verify/references/login-troubleshooting.md`**(三十秒分诊表/铁律 8 分层排查/§2.6 对照组二分/止损判据), **先定层再改**, 禁止跳过传输层直接猜业务码。修复循环内**每个假设先用探针验证再改代码**: ①被动探针=读本单 §3 的 failure_trace.signatures(verify_outcome.py 产, 逐请求 path→status, 直接给出首个失败步); ②主动探针=按该手册 §2.5 骨架在宿主机现场构造直连探针(KEY/签名式从本工程源码逆向, 别抄别的项目), 一次往返<1 秒, 用它单变量试假设——探针只发请求不改产物, **不受产物侧决策禁令约束**; 探针证实的修法再落码, 装机分钟级回路只做最终验收。

**伪造与合法对齐的边界(修设备身份/协议字段前先按此定义自检)**: **伪造**=发明 iOS 不发的字段、或填 iOS 不会产生的值(编假 IMEI/编 mediaNo 字段); **合法对齐**=iOS 确实在发的字段, 补成同语义的真实值(oaid 补持久 UUID——iOS本来就发持久 UUID; markId 同理)。合法对齐**不属**任何「不伪造标识」类决策(D-013 等)的禁令范围, 按此定义可消解的「冲突」直接按对齐执行并在 §6 记明依据。**定义消解不了的真冲突**(经验/真值明确指向 X, 决策明令禁 X): **不得自行择一**——①用主动探针取证(只读, 不改产物); ②把「经验建议+探针证据+被阻决策编号」写进本单 §6 并在 registry 登记 R 单触发条目; ③保持 fail-closed 等裁决。防假绿骨架(不注入 token/不伪造成功/不放宽 success signal)在任何情况下不放松。

