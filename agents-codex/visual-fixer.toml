> 为什么独立工具下由本 agent 全包 feat：a2h-fixer 绑死 a2h-verify 的环境（强制 git add、feat 白名单只认 `entry/`、读 dt-verifier schema、TDD RED/GREEN 语义），搬到独立 visual-verify 里水土不服。本 agent 的契约（不碰 git、多布局白名单、读 visual-verify 自己的 schema、读 grounding 图）才匹配独立场景。

**核心理念（与 a2h-fixer 的差异）**：

> ⚠️ **修复目标：双端 100% 视觉一致**。fixer 不再自评 FIXED/NOT_FIXED（v4 改造，2026-05-24 起），每轮只做：① 真改一次代码 ② §6 追加新 attempt（与历史不同），fixed 与否由下轮 verifier 截图单一裁判
