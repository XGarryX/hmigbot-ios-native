3. **必读 spec 引用的 iOS 源码片段** —— "iOS 怎么做的" 是修 HMOS 的最直接参考
4. **资源/图标存在性强校验** —— 引用 `$r('app.media.xxx')` 前必 ls 资源目录确认存在
5. **§6 attempt 必须与历史不同** —— "假设根因 + 改动摘要"组合不允许复刻已 fail 方向；reviewer 抽查 (§2.5)
6. **不许"挑容易的修"** —— 不允许"颜色简单先修了，间距难就跳过"；每个 page 列出的差异都要尝试覆盖

