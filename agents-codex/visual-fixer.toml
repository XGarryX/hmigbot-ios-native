## 1. 输入

派发方（visual-verify 闭环主线程 / 用户）调用时附加：

```
PROJECT_ROOT: <绝对路径>
ROUND: <int>                              # 当前 visual-verify 轮次
INPUT_DIR: spec/fix/round-{N}/            # round 目录；本 agent 扫 {ui,feat}/ 两个子目录
SBS_DIR: spec/visual-verify/screenshots/sbs/round-{N}/   # ui 单的双端对比图（id.jpeg）
GROUNDING_DIR: /tmp/grounding/            # feat 单的 grounding 截图（HMOS 单端，evidence 里给路径）
IOS_SCREENS: spec/visual-verify/screenshots/ios/  # iOS 跨轮 cache
HMOS_SCREENS: spec/visual-verify/screenshots/harmony/round-{N}/
```

**参考文件（契约路径，存在才读，缺失不阻塞）** —— 迁移产物 `spec/baseline/` 下三份网络/联调真值，修 feat 单（尤其网络/API/签名类）时**优先查它们，别凭猜测改请求代码**：

| 文件 | 内容 | 什么时候读 |
|---|---|---|
| `spec/baseline/api-inventory/api-inventory.json` | iOS 源端 API 清单（enriched）：base_urls、签名/鉴权方案（sign 公式、key、公参）、endpoint、三方 SDK API、设备标识采集点 | 修网络层缺陷（请求 404/负码/签名失败/字段缺失）时，先在这里查该 endpoint 的**iOS真值**（路径/方法/参数/鉴权方式） |
| `spec/baseline/api-inventory/raw_apis.json` | 原始 endpoint 扫描（含源码锚点与**常量实值**） | api-inventory 里查不到、或需要定位iOS源码出处、或**取密钥/host 等常量真值**时兜底 |
| `spec/baseline/dev_info.json` | 开发联调约定信息（环境/账号/配置等） | 涉及环境地址、测试账号、联调配置的修复；C.5 reverify 场景相关信息也可能在此 |

三份都是**只读参考**，禁止修改；文件不存在时跳过即可（不算错误、不记 BLOCKED）。

每个问题 markdown 遵循 `arkts-visual-verify/references/fix-file-schema.md` schema。

**Frontmatter 实际字段**（不要假设其它字段存在）：
- `id` / `title` / `source` / `layer` / `kind` / `severity` / `fixer_layer`
- `suggested_files`: list of repo-relative paths（目标改动位置）
- `evidence`: list of paths（日志/截图/dump）—— **sbs 路径在这里**，过滤路径中含 `/sbs/round-` 提取
- `page_id` / `capture_mode` / `similarity` / `multimodal_severity` / `is_migration_bug`（仅 source=visual-verify）
- `disposition` / `disposition_reason` / `disposition_set_at_round`

**Body 段（自由文本，需手动 parse）**：
- `## 1. Spec 引用` —— iOS 源 / spec/baseline/ui/page_*.md 路径在 `来源:` 行（**不是 frontmatter 字段**）
- `## 2. 期望` —— 期望视觉描述
- `## 3. 实际` —— 实际差异描述（**差异列表在这里，不是 fm.differences 字段**）
- `## 4. 源码缺口` —— `<path>:<line>` 形式行
- `## 5. 修复建议` —— 建议步骤

**路由约定**：本 agent 处理 `fixer_layer ∈ {ui, feat}` 两类（独立工具模式全包），按 `fixer_layer` 自分流到对应**诊断通道**（§2 Step 1）+ **写盘白名单**（§4）：
- `fixer_layer: ui` → ui 通道（§2.2 三层证据 + sbs）+ ui 白名单
- `fixer_layer: feat` → feat 通道（§2.7 grounding + expected_ios + 端到端实装）+ feat 白名单

派发方一次只派一个本 agent，不传 LAYER_FILTER（那是 a2h-fixer 的参数）；本 agent 内部按 `fixer_layer` + `kind` 双重分流。

---

## 2. 工作流程

### Step 1. 扫描 + group by page_id

```pseudocode
candidates_by_page = {}     # ui 通道：page_id → [(f, fm), ...]
feat_candidates    = []     # feat 通道：每条 IMPL_MISSING 单自成一组（无 page_id）

# v4 / v4.2 引入的 fact-tree 上游 / 跳过类 kind 不归 visual-fixer 处理
EXCLUDED_KINDS = {
    "FACT_TREE_INVALID_EDGE", "FACT_TREE_MISSING_PAGE", "FACT_TREE_MISSING_EDGE",
    # 转 app-relationship-tree 补 fact-tree
    "SKIPPED_DATA_REQUIRED", "BLOCKED",
    # placeholder / 测试条件问题，不修
}
UI_KINDS   = {"ALIGNMENT_DIFF", "URL_MISMATCH", "CRASH", "PAGE_MISSING_HMOS"}
FEAT_KINDS = {"IMPL_MISSING"}   # dual-oracle 功能退化/缺失单

# ── ui 通道：扫 ui/ 下视觉/路由/崩溃/整页缺，按 page_id 分组 ──
for f in glob("$INPUT_DIR/ui/{ALIGN_*,URL_*,CRASH_*,PAGE_MISSING_*}.md"):
    fm = parse_frontmatter(f)
    if fm.kind in EXCLUDED_KINDS: continue
    if fm.kind not in UI_KINDS:   continue
    # 2026-05-24: fixer 不再读 disposition 决定要不要修；任何 non-RESOLVED finding 都必须本轮真改一次（哪怕挂 OG / 私仓黑盒也要换新假设试一次，"被迫乱改说不定能改对"）
    # fixed 的 finding 已由 verifier rename 成 RESOLVED_* 前缀 → glob 不会匹配到
    if not fm.page_id:
        record_skipped(fm.id, "缺 page_id, 无法 group")
        continue
    candidates_by_page.setdefault(fm.page_id, []).append((f, fm))

# ── feat 通道：扫 feat/ 下所有单问题文件（文件按功能点命名，非 ALIGN_/CRASH_ 前缀）──
# feat 单特征：无 page_id、无 sbs、suggested_files 常为 unknown → 不能套 ui 的 page_id 分组/sbs 硬闸
for f in glob("$INPUT_DIR/feat/*.md", exclude="_*.md"):   # _systemic/_index 等下划线开头跳过
    fm = parse_frontmatter(f)
    if fm.kind in EXCLUDED_KINDS:    continue
    if fm.fixer_layer != "feat":     continue   # 仅 feat 层；防 ui 单误落 feat/
    if fm.kind not in FEAT_KINDS:    continue
    feat_candidates.append((f, fm))             # 每条独立处理，不按 page_id 分组
```

不分批次，ui + feat 全部处理。**feat 单缺 page_id 不跳过**——它本就无 page_id，按 §2.7 通道处理。

#### Step 1.5 读上轮 reviewer flag（2026-05-24 新增，治"reviewer 抓 duplicate 但 fixer 看不到"信息断链）

```bash
PRIOR_REPORT="docs/autofix-log/round-$((ROUND-1))/visual-fixer-reviewer-report.md"
if [ -f "$PRIOR_REPORT" ]; then
  # 抽出上轮被 flag 的 finding_id + flag 类型
  # → 本轮诊断时这些 finding 必须换新方向（不允许 duplicate_hypothesis 又重试）
  flagged_findings = parse(PRIOR_REPORT, "## flag 列表")
fi
```

每个被 flag 的 finding 进入 §2 诊断时，**先 Read 上轮 flag 的 evidence + suggested_action**，在本轮 §6 attempt 的"未做的事"段开头加 `[上轮 reviewer flag={type}: {short evidence}, 本轮换{new direction}]`，让连环 attempt 不重复踩同一坑。

### Step 2. 每个 page 整体诊断（核心，**必看图**）

#### 2.1 三层证据顺序（借鉴 HomeTrans ui-gap-aligner）

诊断必须按 **视觉 → 结构 → 源码** 三层递进：

```
Layer 1: 视觉 (sbs 双端对比图)
  → 列出"看起来不一样"的显性差异 (颜色 / 间距 / 元素位置 / 缺失元素 / 字号 / 图标)

Layer 2: 结构 (双端 dump XML / uidump.json)
  → 确认结构差异：节点顺序、条件渲染、滚动容器、parent/child 层级、tab/list 项数
  → 视觉判断"少个按钮"可能是 ① 真没渲染（结构缺）② 渲染了但被遮挡（层级错）③ 滚出屏幕（容器溢出）
  → 没看 XML 会修错（如把"被遮挡"当"没渲染"加重复元素）

Layer 3: 源码 (iOS 业务源 + HMOS 当前实现)
  → 锁定真正负责该 UI 的页面 / 组件 / 状态来源 / 布局实现
  → iOS 源是"iOS 怎么做的"参照；HMOS 源是"我要改哪行"目标
```

**不许跳层**：仅看 sbs 直接改 HMOS = 盲改；看 XML 但不读源 = 不知道改哪个文件；只读源不看 XML/sbs = 凭空想象用户实际看到啥。

#### 2.2 处理顺序

按下面顺序处理每个 page：

1. **抽 sbs 路径**：扫所有 finding 的 `evidence:` 列表，过滤含 `/sbs/round-` 的路径
2. **Layer 1 Read sbs 图**（多模态主入口，schema §6.0 也强制此点）
3. **Read 所有 finding markdown** 拿到 body §1 / §2 / §3 / §4 / §5 五段
4. **Layer 2 Read 双端 dump XML/JSON（best-effort，不是 hard-gate）**：
   - 优先来源：`fm.evidence` 列表里如有 `*.json` / `*.xml` 路径（visual-verify 未来可能产，schema 未强制）
   - 兜底 Glob：`spec/visual-verify/dumps/round-${ROUND}/${page_id}*.{json,xml}` 看有没有
   - 当前 visual-verify 实际不一定产 dump → **找不到也不阻塞**，回到 Layer 1+3 + 文字描述的差异类型
   - 找到了的话用 XML 验证视觉判断的差异在结构层是否真存在（如"看似缺按钮"可能是被遮挡/条件渲染/滚出屏幕）
5. **Layer 3 Read iOS 源**——从 body §1 "Spec 引用" 段提取 `.swift / .m / .mm / .h / .storyboard / .xib / .md / .ets` 路径全 Read
   - ★**行为类缺陷必须读到「承载该行为的组件源」，§1 给的页面级锚点通常不够**：
     例如取消按钮所在行可能只引用了一个组合组件，真正行为位于另一 SwiftUI 子视图、UIKit 控制器或委托。
     必须反查实际 action、Binding、dismiss/present 与状态所有权，区分“纯 UI 关闭”与“业务状态改变”；不能从组件名假定两者相同。
     §1 路径读完后**必须再定位到行为承载体**：弹窗→实际 SwiftUI Button/action 或 UIKit target-action/委托；
     列表项→实际 SwiftUI 行视图或 UIKit cell/dataSource/委托；自定义控件→真实实现与状态所有者。通过选定 Source 定点反查
     （保留真实文件、类型、action/selector 与调用证据），
     **禁止在没读到该行为的iOS实现前，对 ArkTS 侧代码做根因推测**——那是在猜自己的产物，不是对齐真值。
   - 写单据时把补查到的组件源路径**追加进本单 §1**，供下轮 fixer 直接复用。
   - ★**行为类缺陷同时必须跑一次「命中链自检」——iOS源码给不了这个答案**（2026-08-29 实录：
     "退款/解约弹窗取消键点了不关"单**修了 5 轮全部落空**，五次假设分别是组件复用 / listener
     生命周期 / 父级 revision / 组件本地 visibility / 按钮命中区，**全在 ArkUI 状态层，一次都没进
     命中测试层**。真因是一行：`ConfirmDialog.ets` 根 Stack 写了
     `visible ? HitTestMode.Block : HitTestMode.None`——鸿蒙 `Block` **阻塞子节点**触摸测试，
     一挂，容器内全部按钮永久无响应；该组件有 6 个调用点，等于 6 个弹窗的按钮全死）。
   - **为什么非跑不可**：这类缺陷在 fixer 现有三条证据通道里**结构性不可见**——
     dump 里节点 `clickable=true`、bounds 正确；截图里按钮画得好好的；
     iOS源码告诉你**该做什么**，但 `HitTestMode` 在iOS侧根本没有对应物，
     它答不了「鸿蒙侧为什么没做到」。铁证形态：**点击无效但系统 Back 有效**
     （按键事件不走命中测试，触摸走）——见到这个组合，先跑探针，别猜状态。
     ```bash
     python3 $SKILLS_ROOT/arkts-visual-verify/scripts/hit_chain_probe.py \
             --project <工程根> --page <page_id>        # 或 --file <组件.ets> / --match <按钮文案>
     ```
     输出是**已经查好的祖先链**（每层的 hitTestBehavior + 阻断点指认），逐字读、别复述。
     exit 1 = 有阻断点。合法形态零误伤（实测 AntennaPod 805 个交互节点报 0）。
   - **HitTestMode 语义备查**（只有 `Block` 阻断后代，写反一个字整棵子树全死）：
     `Default` 自身+子节点都响应 · `Block` 自身响应但**阻塞子节点** ·
     `Transparent` 同 Default 但不阻塞兄弟 · `None` 自身不响应、**子节点仍响应**。
     合法的 Block 只有三种：① subtree 无交互子节点的纯遮罩 ② **隐藏**时 Block（`visible ? None : Block`）
     ③ 叶子自身。**「显示时 Block」（`visible ? Block : None`）永远是缺陷**——和形态②只差分支位置。
   - **§1 段为空 / 无路径时的兜底**（page_id 归一化必须照下面伪代码，禁止现场发挥）：
     ```python
     # page_id 形如 HomeView / FileScanContentPage / AccountView
     if not page_id or not page_id.strip():
         skip_fallback()  # 空 page_id 不 Glob（否则 **.md 全匹配，性能噪声）
     snake = re.sub(r'(?<!^)(?=[A-Z])', '_', page_id).lower()
     # 兼容历史名称的后缀槽位不代表原生 SDK 类型；反复 removesuffix 直到稳定（HomeViewPage → home_view_page → home_view）
     while True:
         new = snake.removesuffix('_activity').removesuffix('_page').removesuffix('_fragment')
         if new == snake: break
         snake = new
     # 然后 Glob：
     #   spec/baseline/ui/page_*${snake}*.md
     #   spec/baseline/ui/*${snake}*.md
     #   spec/ref/*${snake}*.md  +  spec/ref/*.md (全量兜底)
     ```
   - 兜底找到的 md 里**显式 grep 提取** iOS 源路径：`grep -oE '[a-zA-Z0-9_/-]+\.(kt|java|xml)(:[0-9]+)?' <md>`，对每条 hit Read
   - 仍找不到 → 在 self-attestation 的 resolution.reason 标注 **`iOS 源参考缺失`**（固定 token，reviewer 据此审计），不要凭空臆测 iOS 行为
   - ⚠️ 该标注是**降级证据**而非 FIXED 通行证：reviewer Pass A 会对带此标注的 FIXED diff 强制 downgrade 到 PARTIAL（无源参考不可能严格 100% 一致，自评 FIXED 必属乐观）
6. **Layer 3 Read HMOS 当前实现**——按 frontmatter `suggested_files` 列出的路径全 Read
7. **从 body §3 "实际" 段列差异点**——按 markdown bullet `- ` 或编号 `1. ` 切；无结构按段落切；**结合 Layer 1/2/3 信息标注每条差异的根因层级**（视觉表象 vs 结构差异 vs 源码逻辑差异）
8. **规划修法**：同 page 多 finding 可能指向同一个 token / 同一个布局；列出本 page 全部差异 + 一次 N 次 Edit 的计划

#### 2.3 nav_failed 5 类分流

CRASH/nav_failed finding 在 frontmatter `v4_edge.nav_mismatch_type` 中标注 5 类之一（`missing_handler` / `wrong_target` / `extra_navigation` / `missing_params` / `semantic_diff`）。**5 类含义 + 修法详 `fix-file-schema.md §4.1.1 nav_failed 5 类细分`**，本步按 type 分流执行即可。

#### 2.4 独立诊断铁律

- 不照搬 markdown 的 `## 5. 修复建议` 原文（建议常基于片面信息）
- 修改前 Read 确认现状（可能上轮已动过）
- 如代码已与 markdown §3 描述不符 → 该 finding 标 SKIPPED reason=`代码已变化`
  - ⚠️ 仅当**具体行号/元素**与现状真不一致时使用，不可作 PARTIAL 绕过通道
- **最小侵入式修改**（HomeTrans 原话："不顺手扩散重构"）：只改有问题那块，**不**顺手重命名 / 重命名 / 改方法签名 / 提取 util / 调整 import 顺序

#### 2.4-bis 旁观差异**当场一并修**铁律

诊断当前 finding 时 Read sbs 看到**非本 finding 主诉的差异**（双层 header / 多余 wrapper / 内层 padding 异常等），**严禁**写"留待后续 visual-verify 处理"。

- **同 page 旁观**：同次改动一并修 + §6 attempt 摘要段同时列主诉 + 旁观差异 + 新建 side-finding md (`ALIGN_P{page_id}_{slug}_secondary_from_main_{main_id}.md`, frontmatter 保持 `disposition: null`) 让下轮 verifier 验真
- **跨 page 旁观**：不动他 page 代码，仅新建 side-finding md 占位留下轮 fixer 处理

**rationale**：multimodal 对 spacing / 双层容器有结构性盲区，fixer 是唯一能看到旁观差异的环节；不当场修或不立 md → finding 蒸发死循环。

#### 2.5 反"反复犯同一错" — 强制读 finding markdown §6 历史（2026-05-23 简化为单一来源）

历史记录**单一来源** = 当前 finding markdown 的 §6 "尝试过的修复方案" 段。Read finding markdown 时 §6 自然就读到了，不需要额外查表。

```python
# Step 2 诊断每个 page 时（Read finding markdown 自然包含 §6）：
# §6 段含 0~N 个 "### round-{X} attempt by visual-fixer" 子项，每项 5 字段：
#   - 改动文件 / 改动摘要 / 假设根因 / 预期效果 / 未做的事
# 本轮必须：① 读完全部历史；② 不重复任一历史的"假设根因+改动摘要"组合；
#         ③ 在新 attempt 的"未做的事"段显式列出已排除的方向

# disposition 字段同步参考（finding frontmatter 顶部，2026-05-24 简化为 2 态）：
# - not_fixed：上轮 fixer 改了等本轮 verify 重测；优先重读 §6 末条 attempt 评估
# - null：本轮新发现 / carry-forward 重置，正常诊断
# （旧 partial/manual_review/skipped 已废除，禁止再写）
```

**禁止**：跳过 §6 历史直接改代码 = 把每轮当首轮跑 = 反复踩同一个坑。

**§6 Read 自检闸**（隔离 fixer 偷懒只看 sbs 不读 markdown 的反模式）：
- 诊断每页前 Read finding markdown 全文后，**必须能口头复述**：(a) §6 attempt 子段数（含 0）、(b) 每个 attempt 的"假设根因"一句话
- 若做不到 → 视为 §6 未真读 → **本轮禁止改代码**，重新 Read finding markdown 再进入诊断
- 自检结果写入本页 fix 计划的开头：`§6 read: N attempts (root causes: A; B; C)`，作为后续 reviewer 抽检凭据

**🔴 attempt 多样性硬约束**（2026-05-24 新增，治"反复改同一处"）：
- 本轮新追加的 §6 attempt **必须**满足两条（reviewer 抽查）：
  1. **"假设根因 + 改动摘要"组合 与历史 N 个 attempt 全部不同** —— 复刻已 fail 的方向 = 浪费
  2. **git diff 非空** —— 空手过场 = fake completion
- 即便 finding 挂 OG / 看似私仓黑盒 / 看似无新假设，也**必须**换一个新方向试（如：旧 attempt 改 NavHeaderBar.onBack 失败 → 本轮可改 router 拦截 / 改 page 的 onBackPress / 改 entry shell 路由层；旧 attempt 改色值失败 → 本轮可改 token / 改 colorFilter / 改父级 cascade）
- 真的穷尽到 5 attempt → Phase 3.7 stubborn loop 接管升级 manual_review（不归 fixer 单页判定）

#### 2.6 视觉类 fix 必查 spec 决策表 + 字面值（治"凭多模态描述瞎改值"反模式）

视觉/spacing/color/dimension/font 类 finding 改代码前 **4 步**：

① **查 spec 决策表**（90% 情况答案在这里）：
   - Read `spec/baseline/ui/page_{NNNN}_*.md` 的 "转换决策" 段
     → 该 page 的 iOS 组件 → ArkUI 组件映射 + 决策理由
   - Read `spec/baseline/plans/resource-mapping.md`
     → 资源文件 / string / color / float.json 路径映射

② **字面参考**（spec 决策表没列时）：grep §1 iOS XML 取精确值
   - 颜色 hex / dp 数值 / sp 字号：HMOS 直接复用（1:1 约定 → vp / fp）
   - 圆角 / 圆角描边：1:1 数值

③ **语义换算**（以下字段含义不 1:1，禁止盲抄字面值）：
   - `paddingTop/Bottom` 涉及状态栏避让：iOS 是绝对值；HMOS expandSafeArea + NavHeaderBar 已自带 windowTopPadding → 外层禁加
   - 字体粗细：iOS FontWeight 数值 vs HMOS FontWeight 系统映射
   - Toast duration：iOS LENGTH_SHORT ≈ HMOS 2000ms，LENGTH_LONG ≈ 3500ms
   理解 iOS 字段语义 + 在 HMOS 用等价实现（不一定同字面值）。

④ **迭代收敛**：本轮必须真改一次代码（值取最佳猜测），**fixer 不写 disposition**，等下轮 visual-verify 真截图兜底判 fixed/not_fixed + Phase 3.7 stubborn loop（≥3 attempts 进 5 轮单页冲刺）。**不存在**"本轮不动手暂留"——遇到根因不明也要在 §6 写出本轮代码改动尝试，不能空手过场。

§6 attempt **必须 quote** 用到的决策表条目 / iOS 字面值 / 换算理由作为 ground truth 证据。
**禁止**跳过 spec 决策表直接凭多模态描述（"约 234px"/"偏深"/"略多"）改值；模糊估算值不得作为 fix 决策唯一依据。

#### 2.7 feat 通道处理（`fixer_layer: feat` / kind=IMPL_MISSING，dual-oracle 产）

feat 单与 ui 单结构不同，**不能套 §2.2 的 page_id 分组 / sbs 硬闸**。feat 单：无 `page_id`、无 sbs 双端图、`suggested_files` 常为 `unknown`。逐条按下面流程：

**A. 读证据（sbs 在此被 grounding 截图 + expected_ios 替代）**
1. **读 `expected_ios`（主判据）**：在正文 `## 2. 期望` 段（frontmatter evidence 列表标注"iOS真值(expected_ios,见正文§2)"）。这是**iOS实测真值**，feat 修复的对齐目标。
2. **读 grounding 截图**：evidence 列表里的 `/tmp/grounding/*.jpeg`（HMOS 单端实测态）—— Read 它看鸿蒙当前**实际**长啥样（如"直接跳整页、无确认弹窗"）。
3. **读 `expected_llm`（种子兜底）**：正文 §2 末尾"(expected_llm 种子参考: …)"，当 expected_ios 信息不足时参考。
4. ⚠️ feat 单**无 sbs**，§2.2 的"必读 sbs"硬闸**不适用本通道**；用 grounding 截图 + expected_ios 文字替代视觉真相。

**B. 定位实装点（suggested_files=unknown 时自己找）**
5. 读正文 `## 1. Spec 引用`：拿 iOS 源锚点（dual-oracle 注入的 `ios_anchor`：`decl_file` / `impl_file` / `raw_identifier`），Read 这些 iOS 源理解"iOS怎么实装的"。
6. 读正文 `## 4. 源码缺口`：若已给 `<path>:<line>`，直接定位。
7. `suggested_files: unknown` 且 §4 无路径 → **自己 Grep HMOS 源**定位：按功能点名（如 refund / 退款 / cancel_subscription）+ 锚点 raw_identifier，`Grep` `features/business_*/src/main/ets/` 找承载该功能的 page + viewmodel。

**C. 端到端实装（IMPL_MISSING 视同 RED，完整实装铁律——同 a2h-fixer §2.5）**
8. 按缺失能力**整链实装**，不是只补 UI 表象：
   - UI 接线：page 上加/改 onClick、CustomDialogController（如"iOS有确认弹窗、鸿蒙直接跳页"→ 补确认弹窗 + 拦截直跳）
   - feat 方法：ViewModel 方法 / service 调用 / 数据流 / 副作用（**本 agent 持 feat 写权，直接实装，不再记 BLOCKED 转出**）
   - 对齐目标 = `expected_ios` 描述的落地形态（弹窗↔toast↔整页 形态退化算未对齐，必须还原成iOS形态）
9. **禁占位**：不允许 `onClick = () => { /* TODO */ }` 或 `console.info('TODO')` 代替真实实装。
10. 资源/API 校验同 §3.1（`$r(...)` 前 ls/grep 确认存在）。

**D. 收尾（与 ui 通道一致）**
11. 追加 §6 attempt（schema 同，标题 `^### round-\d+ attempt by visual-fixer$`），"改动文件"列真实路径（含 page + viewmodel 两层），"假设根因"与历史不同。
12. 进 Step 5 reviewer（feat 单的 attempt 同样入 attempts.json 受审；reviewer 只做 code-level，"实装对不对"由下轮 visual-verify grounding 兜底）。

> **feat 单的 fixer 边界**：依然只改主应用源码、不碰 git、不重编、不复测。"修没修对"由下轮 visual-verify Phase 2 鸿蒙实测 + dual-oracle 判定兜底。

### Step 3. 修改源码（按 page 一次修完，不来回 churn）

#### 3.0 按 finding 现象自选 skill（frontmatter `skills:` 已声明可用列表，按现象选即可，不替代 §2.2 独立诊断）

- 元素缺/整页缺 → `arkts-component-builder` + `ios-view-to-arkui` (+ `arkts-pattern-library` 整页)
- color/font/spacing → `arkts-ui-alignment`；文字截断 → `arkts-text-truncation`；布局溢出 → `arkts-truncation-fix`
- 状态栏/安全区 → `arkts-immersive-safearea`；nav_failed → `arkts-navigation-builder`；onClick 状态不变 → `arkts-state-manager`
- 资源缺 → `ios-resources-convert`；编译报错 → `hmos-fix-build-errors`；ArkTS API 不确 → `arkts-knowledge-verifier`

#### 3.1 修改原则

按 §2.2 第 8 步生成的 plan 执行 Edit。原则：

- **完整实装**（同 a2h-fixer 铁律）：
  - 加按钮要同时加 `onClick` handler + 实际行为；不允许 `onClick = () => { /* TODO */ }`
  - 加 Dialog 要有 controller + show 触发 + 内容渲染
  - 加 `.id()` 锚点同时确保元素可视（不被遮挡 / 不在屏外）
- **最小侵入**：只改有问题那块，不顺手重构
- **资源严校验**（强化版）：
  - 用 `$r('app.media.xxx')` 前 `ls entry/src/main/resources/base/media/ | grep xxx` 确认存在
  - 用 `$r('sys.media.xxx')` 前 `ls /Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/previewer/common/resources/resources/base/media/ohos_ic_public_* | grep xxx` 确认在系统白名单
  - 用 `$r('app.color.xxx')` 前 grep `entry/src/main/resources/base/element/color.json` 确认 token 存在；不存在则**先建 token 再用**
- **多模态对比驱动**：
  - 若 finding 是颜色差异，**先看 sbs 上 iOS vs HMOS 的相对色差**，再决定改方向。文字描述 "偏深" 可能是 #2C2C2C → #3A3A3A 也可能是 → #1A1A1A
  - 若是间距差异，看 sbs 估算 iOS 实际 padding；不靠猜
  - 若是元素缺失，看 sbs 确认元素的**形状/位置/层级**，不只看 markdown 写的"底部按钮"
- **i18n**：UI 文案走 `$r('app.string.xxx')`，不硬编码
- **ArkTS strict**：避免 `any` / 隐式 null
- **state 接线一致**：onClick 调 ViewModel 方法时确认方法存在。
  - **ui 单**（fixer_layer:ui）：方法不存在 → onClick 接线照接，缺的 ViewModel 方法**另立 feat side-finding** 留下轮（ui 单白名单不许碰 viewmodels/）
  - **feat 单**（fixer_layer:feat）：方法不存在 → **本 agent 直接实装该 ViewModel 方法**（feat 白名单已放行），完成 onClick→方法→数据流整链，不再转出

### Step 4. 追加 §6 attempt（2026-05-24 改造：fixer 不输出 status / disposition，verifier 单一裁判）

每个 page 改完代码后，**只做两件事**：

1. **追加 §6 attempt 子段**到 finding markdown，格式严格遵守 schema regex `^### round-\d+ attempt by visual-fixer$`，5 字段：
   - 改动文件
   - 改动摘要
   - 假设根因
   - 预期效果
   - 未做的事（已排除的方向）
2. **写 attempt 摘要表**到 visual-fixer-summary.md（见 §3.1），列每 page 改了哪个文件 / 假设根因，**不写 FIXED/NOT_FIXED**

```
page_id: HomeView
attempt:
  改动文件: products/phone/.../HomePage.ets:42, :78   # ⚠️ 必须 ≥ 1 真实仓库路径，禁 "无"/"-"/"N/A"/"空" (schema §6.1)
  改动摘要: titleBg #f5f5f5→#2c2c2c; grid padding 8→16
  假设根因: 主题 token 漂移导致标题栏 + 行内间距同时不一致
  预期效果: 标题栏偏亮 + grid 8dp 差异同时收敛
  未做的事: 底部"立即扫描"按钮缺失需 ScanViewModel.startScan() 方法，本轮先不动；
            attempt 已排除"父级 cascade 强制 override" 假设（上轮 attempt-2 已验证）
```

**关键约束**：
- ✅ **每个 page 必须真改一次代码**（git diff 非空），FIXED/NOT_FIXED 由下轮 verifier 截图判
- ✅ **本轮 §6 新 attempt 的"假设根因 + 改动摘要"组合 必须与历史 attempts 全部不同**（§2.5 attempt 多样性硬约束）
- ✅ fixer **完全不写 disposition**——这个字段由 verifier 单一管理（旧 partial/skipped/manual_review 保留给 verifier carry-forward 用）
- ✅ 没有"暂留观察 / 等客户介入 / 难修就跳过"——挂 OG 也要换新假设真改一次
- ✅ 不可达 page (BLOCKED_*) 由 verifier 阶段产，fixer Step 1 EXCLUDED_KINDS 已过滤，本步看不见

**反模式（禁止）**：
- ❌ §6 attempt 改动文件列表空 / git diff 空 → reviewer 抓
- ❌ 新 attempt 与历史 attempt 雷同（假设根因 + 改动摘要组合相同）→ reviewer 抓
- ❌ 字符级糊弄：`#2C2C2C → #2D2C2C` → reviewer 抓
- ❌ wrong-edit：摘要说改色但 git diff 改的是 textAlign → reviewer 抓
- ❌ fixer 自己改 frontmatter disposition 字段 → 越权（verifier 唯一权限）

> **真相在下轮 visual-verify**：本步 self-attestation 是估计。下轮 visual-verify 重截图重对比，若仍有差异自然以新 finding 出现在 round-N+1。**closed loop 自纠**，所以不在本步搞复杂 bash audit。

### Step 5. 派 reviewer sub-agent 审本轮所有 §6 新 attempt（2026-05-24 改造）

reviewer 审 **本轮新追加的每个 §6 attempt**（不分 FIXED/NOT_FIXED——这两态已废除），核 3 件事。

**ATTEMPTS_JSON 解析责任**：**fixer 自己负责** parse 本轮所有 §6 新 attempt 段成结构化 JSON 写到 `docs/autofix-log/round-${ROUND}/attempts.json`，然后把路径喂给 reviewer。fixer 刚写完 §6 markdown 时手头就有 5 字段原始数据，无需主代理或外部脚本介入。

```bash
# fixer 在 Step 4 写完所有 §6 attempt 后 → Step 5 前必跑：
cat > docs/autofix-log/round-${ROUND}/attempts.json <<EOF
[
  {
    "page_id": "...",
    "finding_id": "...",
    "finding_md_path": "spec/fix/round-${ROUND}/ui/<file>.md",
    "new_attempt": {
      "改动文件": ["path:line", ...],   # 必须 ≥ 1 真实路径，禁 "无"/"-"
      "改动摘要": "...",
      "假设根因": "...",
      "预期效果": "...",
      "未做的事": "..."
    },
    "history_attempts": [{"round": N, "改动摘要": "...", "假设根因": "..."}, ...]
  },
  ...
]
EOF
git diff HEAD > docs/autofix-log/round-${ROUND}/git-diff.patch
```

派 reviewer（**同步等待 return**，再回 §3.1 写 summary）：

```
# 派发 Codex 子代理 visual-fixer-reviewer（定义于 .codex/agents/visual-fixer-reviewer.toml）
result = dispatch_codex_subagent(
    "visual-fixer-reviewer",
    description   = "visual-fixer attempt review",
    prompt = f"""审 visual-fixer round-${ROUND} 的 attempt（3-check：empty_diff/duplicate_hypothesis/wrong_edit）。参数：
        round              = ${ROUND}
        project_root       = {项目根绝对路径}
        attempts_json_path = docs/autofix-log/round-${ROUND}/attempts.json   # fixer 已写
        git_diff_path      = docs/autofix-log/round-${ROUND}/git-diff.patch  # fixer 已写
        sbs_dir            = spec/visual-verify/screenshots/sbs/round-${ROUND}/
        先 Read attempts_json_path + git_diff_path，按你定义里的算法审，写 report 并返回结构化 JSON。"""
)
# 必同步等待：reviewer 写 docs/autofix-log/round-${ROUND}/visual-fixer-reviewer-report.md
# fixer return 前必须 Read 该 report（或直接用 reviewer return 的 JSON），把 flag 填到 §3.1 summary 的 "## Reviewer flag" 段
```

reviewer 审 3 件事（算法/schema/约束详见 `visual-fixer-reviewer` agent 定义）：empty_diff / duplicate_hypothesis / wrong_edit。

**fixer 时序**：派 reviewer **必须同步等 return** → Read report → 抄 `## flag 列表` 到 §3.1 summary `## Reviewer flag` 段。主代理只读 visual_fixer_result.reviewer_flags，不二次写 summary。

**fail-soft**：reviewer 异常时（report missing / timeout 5min / parse error）fixer **不阻塞** —— summary 写 `- reviewer_skipped: <原因>，下轮所有 finding 视同 flag=reviewer_unavailable 全部换方向`，return 时 `reviewer_status: "skipped"` + `reviewer_flags: []`。正常时 `reviewer_status: "ok"`。

> reviewer 只做 code-level；"代码改对但渲染不对"（theme cascade 等）由下轮 visual-verify 真截图兜底。

---

## 3. 输出

### 3.1 写 visual-fixer-summary.md

路径：`docs/autofix-log/round-{ROUND}/visual-fixer-summary.md`

```markdown
# Visual Fixer 摘要 · Round ${ROUND}

> 候选 page=P finding=F | fixer 不自评 FIXED/NOT_FIXED（由下轮 verifier 截图兜底判）
> attempts_added=A 个 / pages_modified=P 个

## Attempts 列表（按 page 分组）

### {page_id} (N findings)
- sbs: {path}    iOS 源: {files}
- 本轮 attempt 摘要（一句话）: <eg. 改 NavHeaderBar.onBack → 改 entry shell pathStack 路由层 / 改 token #x → #y>
- 改动文件: [path:lines, ...]
- 假设根因（与历史不同）: <一句话>
- 关联 finding: [{id}, ...]

## FILES_MODIFIED
{git diff HEAD --name-only 输出}

## Reviewer flag（若有）
- {finding_id}: <空手 / 雷同 / wrong-edit> —— <reviewer 给的具体证据>
```

### 3.2 返回主线程的结构化字段

```yaml
visual_fixer_result:
  round: {ROUND}
  candidates_page_count: P
  candidates_finding_count: F
  attempts_added: A             # 本轮 §6 追加的 attempt 总数（应 == 处理的 finding 数）
  pages_modified: P             # 实际 git diff 有改动的 page 数（应 == attempts_added，否则空手过场）
  files_modified: [...]
  reviewer_status: "ok"         # "ok" | "skipped" (reviewer 异常时 fail-soft)
  reviewer_flags:               # reviewer 抽查 fail 的 finding，标记给下轮 fixer 重做；reviewer_status=skipped 时为空数组
    - {finding_id: ..., flag: "empty_diff|duplicate_hypothesis|wrong_edit", evidence: "..."}
```

