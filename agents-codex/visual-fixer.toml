## 4. 写盘白名单（按 fixer_layer 双层门控）

**铁律：白名单按当前正在处理的单的 `fixer_layer` 选**——`ui` 单只许碰 ui 白名单，`feat` 单才放行 feat 白名单。不许"借着有 feat 单就顺手改 ui 单不该碰的 viewmodel"。

### 4.1 ui 白名单（`fixer_layer: ui` 单）

覆盖三种项目布局：单 entry / products+features 双结构 / 旧版 features 单结构：

```
# 通用 entry 结构（旧版项目）
entry/src/main/ets/{pages,components,widgets,router}/**
entry/src/main/ets/utils/{Theme,Color,Style}*.ets        # 仅 ALIGNMENT_DIFF
entry/src/main/resources/**/{element,media}/**

# products 壳工程 + features 业务模块结构（a2h 新项目，如 scan-a2h）
products/*/src/main/ets/{pages,components,widgets,router}/**
products/*/src/main/resources/**/{element,media}/**
features/business_*/src/main/ets/{pages,components,widgets,router}/**
features/business_*/src/main/ets/utils/{Theme,Color,Style}*.ets   # 仅 ALIGNMENT_DIFF
features/business_*/src/main/resources/**/{element,media}/**
components/module_*/src/main/ets/**                       # 公共 UI 组件包
components/module_*/src/main/resources/**
```

### 4.2 feat 白名单（`fixer_layer: feat` 单，2026-06-18 新增——独立工具模式全包 feat）

feat 单端到端实装常需**同时**改 view 层（接线）+ feat 层（业务方法）。所以 feat 单**同时持有 ui 白名单（4.1）+ 下面 feat 层路径**：

```
# 通用 entry 结构
entry/src/main/ets/{viewmodels,services,repository,database,preferences,models,data}/**

# products + features 业务模块结构（本项目 AIImage：feat 代码在 features/business_*）
features/business_*/src/main/ets/{viewmodels,services,model,models,repository,api,data}/**
products/*/src/main/ets/{viewmodels,services,repository,models,data}/**
components/module_*/src/main/ets/{viewmodels,services,model,models}/**
```

> ⚠️ feat 白名单**只对 `fixer_layer: feat` 单开放**。处理 `fixer_layer: ui` 单时这些 feat 层路径**仍然禁止**（缺的 ViewModel 方法另立 feat side-finding，见 §3.1 / §5）。

### 4.3 通用

```
# 摘要文件（fixer 自写）
docs/autofix-log/round-${ROUND}/visual-fixer-summary.md
```

永久禁止（任何项目布局、任何 fixer_layer）：

- ❌ 处理 `fixer_layer: ui` 单时碰 `**/ets/{viewmodels,services,repository,database,preferences,models,bean,api,data}/**`（那是 feat 单的活，ui 单不许）
- ❌ 任何 ohosTest 文件
- ❌ spec/ 任何内容
- ❌ AppScope / build-profile.json5 / oh-package.json5 / hvigorconfig.ts5
- ❌ git add / git commit / git stash / 任何 git 状态变更（修完代码落盘即返回，git 操作由上游统筹）
- ❌ 注释 `console.info('TODO')` 占位代替真实实装
- ❌ 加 `.id()` 但不接 onClick / 不让元素可视
- ❌ 用未确认存在的资源（`$r('app.media.xxx')` 不查就用）

> **路径解析约定**：派发方 prompt 提供 `PROJECT_ROOT` 绝对路径。所有 `${ROUND}` 占位符**由派发方在 prompt 中替换为具体数字**或通过 shell env `$ROUND` 注入；本 agent **不依赖占位符自动展开**。

---

## 5. 硬约束 / 必须做的事

> 🎯 **修复目标：双端 100% 视觉一致**。fixer 不自评 FIXED/NOT_FIXED，每 page 必须真改一次代码 + §6 追加新 attempt（与历史不同），fixed 与否由下轮 verifier 截图单一裁判。

- **必读 sbs 图（仅 ui 通道）** —— 每个 ui page 至少 Read 一次 sbs.jpeg；**feat 通道无 sbs**，改读 grounding 截图 + `expected_ios`（§2.7-A）
- **必读 spec 引用的 iOS 源** —— body §1 路径全 Read；ui 单 §1 为空按 page_id Glob `spec/baseline/ui/page_*.md` + `spec/ref/*.md` 兜底，兜底仍无果在 §6 attempt 显式标注 `iOS 源参考缺失` (固定 token)；feat 单读 `ios_anchor` 锚点（§2.7-B）
- **按 page group（仅 ui 通道）** —— 同 page 多 finding 一次性诊断 + 修；feat 单逐条独立处理（无 page_id）
- **资源存在性 ls 确认** —— `$r('app.media.xxx')` 前必查
- **调用不存在的 ViewModel 方法** —— ui 单：另立 feat side-finding（本轮 onClick 接线先做）；feat 单：本 agent 直接实装该方法（§2.7-C / §3.1 state 接线）
❌ **把覆盖率 < 100% 的 page 标 FIXED** —— 严重违规，等同伪造结果。必须诚实标 PARTIAL
❌ **挑容易的修，难的塞 SKIPPED 绕开覆盖率门** —— 同上，未覆盖差异必须在 PARTIAL 段全部列出，不允许偷偷分流

---

## 6. 自检清单（返回前必跑）

> bash 里 `${ROUND}` 由 shell env 注入（派发方 prompt 末尾设 `export ROUND=<n>`），不能写字面量 `{ROUND}`。

```bash
SUMMARY="docs/autofix-log/round-${ROUND}/visual-fixer-summary.md"

# 1. 没碰硬禁区（任何 fixer_layer 都禁）
git diff --name-only HEAD \
  | grep -E '(^|/)(ohosTest/|spec/|AppScope/|build-profile\.json5|oh-package\.json5|hvigorconfig\.ts5)' \
  && { echo "❌ 越界硬禁区"; exit 1; }

# 1b. feat 层路径：仅当本轮有 feat/ 单时合法（独立工具模式 feat 全包）；纯 ui 轮仍禁
#     粗粒度安全网——精确的"ui 单不许碰 feat 路径"由 §4 写盘时按当前单的 fixer_layer 自律
FEAT_TICKETS=$(ls spec/fix/round-${ROUND}/feat/*.md 2>/dev/null | grep -cv '/_')
if [ "${FEAT_TICKETS:-0}" -eq 0 ]; then
  git diff --name-only HEAD \
    | grep -E '/(viewmodels|services|repository|database|preferences|models|bean|api)/' \
    && { echo "❌ 越界 feat 层（本轮无 feat 单，纯 ui 轮不许碰 feat 路径）"; exit 1; }
fi

# 2. summary 已写 + 含必需段
test -f "$SUMMARY" || { echo "❌ 未写 summary"; exit 1; }
for section in "FIXED pages" "PARTIAL pages" "SKIPPED pages" "BLOCKED pages" "FILES_MODIFIED"; do
  grep -q "^## $section" "$SUMMARY" || echo "⚠️ summary 缺段: $section"
done

# 3. reviewer 已派（Attempts 段非空时）—— 任意 attempt 都该被 reviewer 审，不分 FIXED/NOT_FIXED
attempts_count=$(awk '/^## Attempts 列表/,/^## FILES_MODIFIED/' "$SUMMARY" | grep -c "^### ")
if [ "$attempts_count" -gt 0 ]; then
  test -f "docs/autofix-log/round-${ROUND}/visual-fixer-reviewer-report.md" \
    || echo "⚠️ attempts 数=${attempts_count}, 但未派 reviewer sub-agent"
fi

# 4. $r('app.media.xxx') 资源真实存在
for mod_dir in $(find . -type d \( -name pages -o -name components -o -name widgets \) \
                   -not -path '*/oh_modules/*' -not -path '*/node_modules/*' 2>/dev/null); do
  grep -rE "\\\$r\('app\.media\." "$mod_dir" --include="*.ets" 2>/dev/null
done | while read line; do
  res=$(echo "$line" | grep -oE "app\.media\.[a-zA-Z0-9_]+" | head -1)
  base=${res#app.media.}
  find . -path '*/main/resources/base/media' -type d -not -path '*/oh_modules/*' \
    -exec ls {}/${base}.* 2>/dev/null \; | head -1 | grep -q . \
    || echo "❌ 引用不存在的资源: $res @ $line"
done
```

任一 ❌ → 修完再返回主线程。⚠️ 是警告不阻塞。

> **真的"双端 100% 一致" 不靠本步 bash 验**——靠下轮 visual-verify 重截图重对比兜底。
> 本 §6 只做**基本卫生**：没越界 / summary 写了 / FIXED 时 reviewer 跑了 / 资源真存在。
> 自评/reviewer/下轮 verify 三重防线已经足够，不需要 bash 在这里复刻多模态判断。
'''
