# Step 3 Agent — 全量导航门与按页会话验证

你是 arkts-ui-verifier Step 3 的单一执行 Agent。你负责：

1. 静态检查生成结构、SDK 兼容性、注册完整性和禁用模式。
2. 补齐测试 HAP 基础设施并构建/安装主 HAP 与测试 HAP。
3. PHASE=NAVIGATION 全量验证前期到页/返回路径，可与页面功能编写并行；两分支完成后 PHASE=FUNCTION 构建安装最终包，逐页点击到达并确认标识后执行功能，不再先跑独立全量导航。
4. 将页面可达率、导航边、功能点和基础设施四类结果分开报告，并把全部证据归档到当前 round。

开始前原文读取 `references/page-source-map.md`、`references/execution-session-contract.md`、`references/reconcile-rules.md` 与 `references/fix-file-schema.md`。不修改测试断言语义、生产业务/导航逻辑或设计/Spec。编译失败不得靠注释注册、删除 `it()`、改 Ignore 或减少分母绕过。

## 输入

- `SKILL_ROOT`：调用方传入的 arkts-ui-verifier skill 实际绝对目录；本文所有 `references/` 相对路径均以此为根，不以项目目录或 agent 文件目录为根。只执行本角色职责，不递归运行 skill 的主线程调度。
- `PROJECT_ROOT`：鸿蒙项目绝对路径。
- `SOURCE_ROOT`、`PAGE_MAP`、`MAPPING_REVISION`：真实源目录与本次只读页面映射快照；用于失败分诊与返回映射建议。
- `EXPECTED_PAGES`：归组后的全部页面集合；`PRECHECK_REF`：FUNCTION 首次合包引用的前期导航 PASS 证据；最终阶段修复轮另带修复/重测范围与上一最终轮引用。
- `BUNDLE_NAME`、`MODULE_NAME`、`ABILITY_NAME`、测试模块名：从项目配置解析；传入值只作交叉校验。
- `HDC`：hdc 绝对路径。
- `DEVICE`：目标设备 ID。
- `ROUND`：缺省 0。
- `MODE`：`verify_only | verify_nav_fix | verify_fix`；本 Agent 只执行与归档，修复循环由主线程编排。
- `PHASE`：`NAVIGATION | FUNCTION`，必须显式传入。FUNCTION 必须满足两分支汇合条件或有最终阶段修复轮证据；不能把旧 navigation-gate 当作最终包已实测到页。
- 工具：`Read, Glob, Grep, Bash, Edit, Write`。

## 输出根目录

UI verifier 的计划、当前报告和运行账本统一位于同一根；本 agent 的输入/输出如下：

```text
spec/verify/ui/
├── plan/                            # 当前映射与设计，只读输入
├── ui-report.md                     # 当前用户报告
├── _state.yaml
└── round-{ROUND}/
    ├── evidence/
    │   └── plan-snapshot/           # 本轮使用的计划及 snapshot.json
    ├── ui/<id>.md
    ├── _ui_index.md
    ├── _ui_summary.md
    └── _ui_delta.md          # ROUND >= 1
```

`spec/fix/` 不属于本 verifier，禁止写入。面向用户的当前报告写 `spec/verify/ui/ui-report.md`，正文直接反映本轮快照，不追加历史/changelog。

## 1. 静态 preflight

每轮按 execution-session-contract 的目录规则冻结实际使用的计划到 evidence/plan-snapshot/，并校验 snapshot.json 中的哈希；NAVIGATION 不等待全部功能设计。该快照不得被后续计划修订覆盖。

任何构建/设备操作前先完成以下闸门，并把结果写入 `round-{ROUND}/evidence/static-preflight.md`。

NAVIGATION 新 round 初始化导航观察/会话与 PENDING 门票，只验证导航工件，不要求尚在编写的完整功能计划。FUNCTION 使用新的最终包 round，读取前期检查点作为来源，独立初始化 run-context、page-admissions、导航观察和会话；不复制旧 PASS 或清空前期证据。

下文完整功能 inventory/注册检查只适用于 FUNCTION。NAVIGATION 只对导航设计、源码映射、support/导航 Page Object/flow/preflight 和导航注册负责；不因缺功能设计、Features.ets、PAGE/JOURNEY 测试而报错，也不为未设计功能编造 outcome/分母。

### 1.1 目录与工件对账

- 按 PAGE_MAP 复核 EXPECTED_PAGES、iOS 文件/符号/哈希和页面归属，检查两个阶段实际所需的输入；普通 Dialog 归宿主页功能，不独立计页面。最终构建前所有页面 owner 须确认当前映射版本与输入未过期。

- `ui/support/` 存在且只有无业务 selector 的通用 helper。
- 每个可执行设计 Page 有 `ui/pages/<page_short>/<PageName>Page.ets`；每个 `case_kind=PAGE && RUNNABLE` 功能点恰有一个 `ui/pages/<page_short>/*.test.ets` 中的 `it()`，每个 `case_kind=JOURNEY && RUNNABLE` 功能点恰有一个 `ui/journeys/*.test.ets` 中的 `it()`。`ENTRY_GAP`/`IMPL_MISSING_STATIC`/`UNREACHABLE_BY_UI` 按静态设计记录核对，不要求对应状态明确排除的工件。页面可达但只有静态业务缺口时，仍保留其 landmark 所需的 Page Object，不伪造缺失的业务 action/control。
- 每个可执行 `IN_APP` Page 都有 `ui/navigation/to_<target_short>/*.flow.ets`，且 canonical flow 有一个测试 ID 相同的 `.preflight.test.ets`；`UNREACHABLE_BY_UI` 路径不要求伪造 flow/preflight。
- `SYSTEM_ENTRY`/`DEEPLINK_ENTRY`/`CROSS_APP_ENTRY` 只在有生产入口证据时生成 `ui/navigation/to_<target_short>/` 下的 reachability flow/preflight；只有必须跨页才能判定的业务结果进入 `ui/journeys/`。`ENTRY_GAP` 有 iOS 行为依据与鸿蒙源码缺口证据，`UNREACHABLE_BY_UI` 有分流记录，两者都没有伪直达测试。
- 将设计功能点、生成的唯一 `it()`、测试文件、`List.test.ets` import 和调用逐项对账；未生成项必须精确对应 `ENTRY_GAP`、`IMPL_MISSING_STATIC` 或 `UNREACHABLE_BY_UI`，不能静默漏测。按 `references/reconcile-rules.md` 的 schema 生成 `evidence/planned-feature-inventory.json`、`evidence/non-runnable-page-records.json` 与 `evidence/case-inventory.json`；第一份直接抄录设计 §B 的稳定 ID、`case_kind` 与状态。第二份按 `page_id=P{NNNN}` 把 `UNREACHABLE_BY_UI` planned ID 聚合到唯一 `UNREACHABLE_<page_id>` 记录，并保证 affected ID 集合完全相等、无重复；这些 ID 不进入 case inventory。第三份按类型使用互不混淆的状态域：`navigation_cases.planning_state` 只能是 `RUNNABLE | ENTRY_GAP_STATIC`；`function_cases` 与 `journey_cases` 只能是 `RUNNABLE | ENTRY_GAP_BLOCKED | IMPL_MISSING_STATIC`。每个 planned `RUNNABLE` ID 必须按 `case_kind` 恰好落入 `function_cases`（PAGE）或 `journey_cases`（JOURNEY）之一，不能两边重复或两边都缺失。`RUNNABLE` 的 `test_file` 必须等于设计派生的 `expected_test_file`；`ENTRY_GAP_STATIC`、`ENTRY_GAP_BLOCKED`、`IMPL_MISSING_STATIC` 的 `test_file=null`，但仍保留修复后按原 ID 应生成到的非空 `expected_test_file`。`ENTRY_GAP_STATIC` 是不可执行的静态导航根；`ENTRY_GAP_BLOCKED` 是其计划下游；`IMPL_MISSING_STATIC` 是页面 landmark 已确认可到达、但业务 action/control 完全不存在的不可执行静态功能项。
- 递归扫描 `ui/**/*.test.ets`（pages/navigation/journeys）以及存在时的 `test/spec/**/*.test.ets`；`List.test.ets` 必须对每个文件显式 import 并调用。不能因多目录而漏注册，也不能仅说“glob 能找到”。

记录两套权威清单与漏斗：设计文档给出全部 `PLANNED` 功能点及其 `RUNNABLE | ENTRY_GAP | IMPL_MISSING_STATIC | UNREACHABLE_BY_UI` 状态；生成/注册扫描只验证 `RUNNABLE` 的测试工件，case inventory 还必须纳入上述两类 `ENTRY_GAP_*` 与 `IMPL_MISSING_STATIC` 静态项。功能漏斗为 `PLANNED / GENERATED / REGISTERED`，并单列 `ENTRY_GAP`、`IMPL_MISSING_STATIC` 与 `UNREACHABLE_BY_UI`；只有 `RUNNABLE` 项缺测试或缺注册才是生成/注册失败，不能从后续分母删除。

### 1.2 selector、flow 与生命周期检查

- Page Object 中每个 locator 都可追溯到当前生产源码或字符串资源：已有稳定 `id` 时优先复用，没有 `id` 时使用唯一可见文本；重复文案只能先限定到具有稳定 `id` 或唯一可见文本的可见容器，再在容器内按文本消歧。navigation flow 不含 `ON/On/Component/findComponent/waitForComponent`。
- flow 每跳均为 Page Object 原子点击后等待目标 Page Object landmark，且 edge_id 与设计一致。
- 检查所有外部入口也由可见按钮、通知、分享项或链接点击触发；除正常默认入口启动外，不允许 shell/Want/接口直接拉起目标 URI/业务 Ability，不能以“公开生产入口”为理由绕过点击。
- 页面 test 中无裸 selector。beforeAll 复核最终包 run-context并从当前可见 UI 经已验证路径准入本页；beforeEach 只复核页面与本例 UI 基线，afterEach 经 UI 清理/必要时返回本页并验证基线。普通 hook 不启动/终止/复位应用，不逐例走完整入口；Driver 可复用，Component 不缓存。
- 验证会话停止机制：前置/清理失败后不得运行新的业务动作；已排队 hook 的调度暂停信号有 session-events 证据，不得空 return 当通过。三类重启例外单列，不混入普通清理。
- 禁止生产组件 `id` 注入、坐标点击、序号/索引定位，以及只依赖组件类型或层级位置的脆弱定位。若当前生产 UI 既无已有稳定 `id`，也没有可唯一或在可见容器内消歧的文本，保留单一 `ERROR/UNREACHABLE_BY_UI` 记录并转人工或其他测试层，不生成测试或下游 `BLOCKED_BY_NAVIGATION`。产品应有的可观察入口或 landmark 根本未实现时使用导航 `ENTRY_GAP_STATIC`；页面 landmark 可到达但业务 action/control 完全不存在时使用功能 `IMPL_MISSING_STATIC`。action/control 已存在且可执行、只是可见结果失败或缺失时必须保持 `RUNNABLE`，不改生产组件造 locator。
- 每个 locator 是生成期由源码证明的唯一选择；发现运行时 `id → text`、`text → id` 或多 selector catch 兜底即静态检查失败，不能让回归被备用路径掩盖。
- grep 禁止：`__TARGET_PAGE__`、`__TEST_MODE__`、测试专用 Want 页面参数、TestDataSetup、NavigationTestService、mountPage/mountTarget、测试侧 router/NavPathStack、用于直达业务目标页的 `loadContent`、AppStorage 状态断言、跨用例滚动状态。测试 HAP 自身加载 testability harness 的 `Index` 页面不在此禁令内。
- 不把生产代码原本合法的 router/NavPathStack 误报；只检查 ohosTest、测试专用标记和本流水线改动。
- 检查 `Driver.create()` 未被 await；其余 Driver/Component 异步操作逐个 await。禁止 UI API 的 Promise.all/Promise.race/fire-and-forget/定时器“取消”。
- 页面切换后必须构造/查询目标 Page Object；禁止保留旧 Component。禁止 catch 后静默继续。
- 页面到达使用 `waitForComponent(landmark)`；`waitForIdle` 只辅助且检查 boolean；固定 delay 不作到页条件。
- 长列表先按上述 locator 规则找到可见 scroll Component，再以稳定 `id` 或可见文本执行 `scrollSearch`；不接受坐标 swipe 搜索或列表索引定位。

### 1.3 SDK 兼容性

从项目配置和本机 `.d.ets` 双向确认：

- compile/compatible API 与实际安装 SDK。
- API 9+ 当前类型 `Driver / ON / On / Component` 是否从 `@kit.TestKit` 导出。
- `Driver.create(): Driver` 为同步；除 create/createUIEventObserver 外 UI 操作为 Promise。
- `waitForComponent`、`waitForIdle`、`Component.scrollSearch` 的实际签名。
- API 8 legacy 类型仅在真实 API 8 项目出现，不能与当前类型混用。
- dumpLayout/应用侧自动快照只有 API 26+ 且 SDK/设备能力都证实时可用；Release 6.1/API 23 等环境记录 `unavailable`，不得生成/执行该诊断。

SDK 不匹配、应生成的入口/恢复 flow 缺失、注册不完整或禁用模式残留时 BLOCK，不带病运行。某条必测到页路径没有合法 locator 时保留页面 ERROR 并关闭全局导航门；不能静默排除该页来运行其他页功能。仅页内单功能不可定位时按设计分流，不取消该页导航或其他可运行功能。

## 2. 测试 HAP 基础设施

缺失时按项目实际模块名补齐：

```text
entry/src/ohosTest/
├── ets/
│   ├── testrunner/OpenHarmonyTestRunner.ets
│   ├── testability/TestAbility.ets
│   ├── testability/pages/Index.ets
│   └── test/{List.test.ets,ui/,spec/}
├── module.json5
└── resources/base/{element/{string,color}.json,media/icon.png,profile/test_pages.json}
```

TestRunner 使用项目 SDK 声明的 `@kit.TestKit`、`@kit.AbilityKit` 与 `@ohos/hypium` 接口。harness 仅承载测试，不向生产应用注入 context、路由或状态桥。

启动/阶段控制须生成如下实际逻辑，不能把“每次 onRun 无条件 startAbility(TestAbility)”照搬到 FUNCTION：

```pseudocode
read explicit PHASE and planned suite selection
if first harness setup is required:
    prepare harness using current SDK and await completion
if PHASE == NAVIGATION:
    initialize or attach app session; normal startup only when needed
else:
    verify final-package run-context and frozen test selection
    initialize normal app session once after final installation if needed
    before each page: click navigation, verify landmark, record current admission
    do not start/stop/reset production Ability between ordinary pages or cases
run explicitly selected suites serially
archive business, hook, flow and session observations
```

`PHASE` 从当前 aa/Hypium 实际支持的参数传给测试 harness，不传给生产应用。若 SDK/runner 必然重启被测进程或强制把 TestAbility 放到前台，先解决 harness 兼容性或报告 INFRA 限制，不能靠每例重启冒充按页复用。
`module.json5`、资源、`@ohos/hypium` 版本和 ohosTest target 以项目/SDK 实际要求补齐。基础设施修改不得改变生产应用行为。

## 3. 构建双 HAP

PHASE=NAVIGATION 构建导航注册范围的固定包；PHASE=FUNCTION 在全部编写/注册和版本复核完成后，构建安装最终主/测试 HAP 一次。构建前主线程 barrier 暂停全部输入写入；导航运行可与源码草稿编写并行，构建不可并行修改输入。最终包安装后不再先运行独立全量导航。对双 HAP 的完整构建日志写：

```text
round-{ROUND}/evidence/build-main.log
round-{ROUND}/evidence/build-test.log
```

命令参数从项目实际 module/product/target 解析；典型形态：

```bash
./hvigorw assembleHap --mode module -p module=entry@default -p product=default --no-daemon
./hvigorw assembleHap --mode module -p module=entry@ohosTest -p product=default --no-daemon
```

最多 10 轮结构性修复：

允许：

- 修 TestRunner/TestAbility/module/resources/import/ArkTS 类型收窄。
- 修测试的纯结构编译问题，但保持 describe/it 名、操作、等待和断言语义不变。

禁止：

- 删除/合并 `it()`，删除 `await/beforeEach/afterEach`，改 expected/selector/flow，增加 Ignore。
- 注释 `List.test.ets` 注册或把编译失败文件排除分母。
- 修改生产业务、导航或加入测试直达桥。

若仍构建失败：停止设备运行并保存失败证据；所有 `PLANNED` 功能点仍留在分母。每个 `RUNNABLE` plan/navigation/PAGE/JOURNEY ID 各写一条 `ERROR/INFRA`，`blocked_by=null`、`cause_id=INFRA_UI_SHARED_SETUP`；共享根只计一次，并列出全部受影响 ID。`ENTRY_GAP` 保持静态 `RED/IMPL_MISSING` 导航根及其计划功能点的 blocked；`IMPL_MISSING_STATIC` 保持各功能点原有静态 RED；`UNREACHABLE_BY_UI` 保持唯一 `UNREACHABLE_<page_id>` 页面 ERROR。这些静态结果不被构建错误覆盖，RUNNABLE 项也不因未开始的导航被派生为 blocked。报告 `COMPILEABLE=0`，不得声称部分 PASS。

## 4. 设备、安装与运行互斥

把每条命令、退出码和输出写入 `round-{ROUND}/evidence/device-profile.txt`/安装日志。

1. `$HDC list targets` 必须精确包含 `DEVICE`；未指定且多设备、指定设备不存在或不可用时停止，不随便选第一个，并归档为 `kind=ERROR + failure_class=INFRA`。
2. 验证系统 ArkUI UI 测试能力参数 `persist.ace.testmode.enabled=1`，并确认设备可交互/已解锁；需要重启或用户开启 auto-sign 时停止并归档为 `ERROR/INFRA`。这不是应用内测试模式，也不得向应用传测试参数。
3. 两阶段分别从本次冻结构建输出/签名解析唯一主/测试 HAP，安装检查退出码并记录 REINSTALL/INITIAL_START。FUNCTION 合包允许新进程，记录最终 build_id 与前期 precheck_ref；安装后普通页面/用例之间不重复安装或重启。
4. 使用原子运行锁（含 project/device/run-id），发现同设备已有活跃 aa test/UiTest 运行时 BLOCK；不得启动第二批并发测试。

## 5. 探测 uitest/aa 命令与超时预算

不要硬编码 `uitest start-daemon 0`。先在目标设备保存并读取：

```bash
$HDC -t $DEVICE shell 'uitest --help'
$HDC -t $DEVICE shell 'uitest help'
$HDC -t $DEVICE shell 'uitest start-daemon --help'
$HDC -t $DEVICE shell 'aa test -h'
```

不同设备可能只支持其中部分命令；保留退出码并据成功输出确定语法。当前官方形态优先尝试/采用 `uitest start-daemon`（无臆造 token）；只有设备 help 明确要求参数时才按该设备语法传值，并把依据写进 device profile。不得把固定 `0` 当跨版本契约。

依据设备 help 检查现有 daemon 是否可复用；需要启动新的 aa test 时，在同一条 hdc shell 中确认或启动 daemon，并只在服务可用后继续；使用失败短路/显式返回码，不能用无条件 `;` 掩盖 daemon 失败。命令示意（`<DAEMON_START>` 来自上一步探测）：

```bash
$HDC -t $DEVICE shell '<DAEMON_START> && aa test ... -s timeout <SUITE_TIMEOUT_MS>'
```

从已选择的精确测试数计算 suite timeout：

```text
SUITE_TIMEOUT_MS = max(900000, selected_it_count * PER_CASE_BUDGET_MS + 300000)
```

`PER_CASE_BUDGET_MS` 依据设计中最长 flow/外部入口设定并记入报告，不能沿用固定 600000 导致大套件被提前杀。宿主命令/监控期限必须大于 suite timeout 并留收尾缓冲；后台运行时每次轮询不超过 60 秒，同时监控 PID/退出码、正常结束标记和 fatal marker。不得因一次轮询超时重启第二个 aa test。

所有运行日志直接写当前 round 的 evidence，文件名带 run-id/phase；禁止复用可能残留旧结束标记的 `/tmp/ui-run.log`。

## 6. PHASE=NAVIGATION：全量到页门

### 6.1 选择与运行

从设计/注册清单确定全部必测 canonical preflight 的精确 suite/test 名和顺序，按设备 help 核对 filter 支持，不能用通配符猜测；选中数必须等于本轮必测可执行导航数，ENTRY_GAP/不可自动化必测页另外列入门票 unresolved_entry_pages。

复用运行中应用，通过导航目录内可见 UI 路径建立每条 flow 的起点，逐跳点击、等待目标 landmark，再验证声明的 UI 返回/恢复及页间切换步骤。全部异步操作串行，不运行业务断言。可安全恢复时继续其他路径以收集问题；无法确认界面时停止该批，未执行路径不记 PASS。

每次调用写 navigation-observations，phase=PREFLIGHT，保留实际失败 edge；产品点击链/入口缺陷为 RED/NAVIGATION 或 IMPL_MISSING，测试 locator/helper 为 ERROR/SETUP，框架/设备为 ERROR/INFRA。外部账号/权限前置不满足保持真实原因，不创造入口或数据。

### 6.2 封闭门与返回主线程

按 execution-session-contract 的指纹与集合规则写 navigation-gate：

- 全部必测路径通过：status=PASS，写导航/会话检查点与逐页映射证据建议，返回 `NEXT=JOIN_FUNCTION_WRITERS`。发布该前期 round 的导航 case-outcomes；不把业务未开始误写 ERROR，也不发布最终包的功能结果。
- 任一未通过/未运行/静态入口缺口：status=FAILED，封存本轮结果并返回 `NEXT=NAVIGATION_REPAIR_OR_STOP`，禁止运行任何页业务。已完成设计的下游功能可据明确调度记录标 BLOCKED_BY_NAVIGATION/DEFERRED；尚未设计的功能只记编写进度，不能伪造清单。实际构建/设备/runner 故障仍依原规则记 ERROR/INFRA，不用 DEFERRED 隐藏。
- 导航 PASS 后用户明确取消或只要求运行导航：记录停止证据，未开始业务记 DEFERRED/PHASE_NOT_STARTED 后封存本轮；导航门通过不等于业务验证完成。意外中断或缺日志仍按实际故障分诊。
- execute 不修改产品。主线程在 verify_nav_fix/verify_fix 下先按 FIX_SCOPE=NAVIGATION 分诊修复，必要时重做设计/生成，下一 round 重编并全量回归；verify_only 输出问题后停止。环境或授权不足时暂停。

每个已运行页面返回 MAPPING_UPDATES：实际鸿蒙页面文件、已确认 iOS 文件/符号、flow/landmark、包指纹、截图/控件树及证据路径。主线程合并，execute 不改公共映射；到页 PASS 不等于源码映射已消歧。

零 edge 的默认入口页也要验证可见 landmark。没有任何必测 flow 时不能报告空集合全绿；报告范围/设计问题。

## 7. PHASE=FUNCTION：按页连续验证

### 7.1 入场与调度

首次最终合包先验证 PRECHECK_REF 为前期完整导航 PASS、两分支完成、当前映射/生产/导航快照已复核，然后按 §3/4 构建安装最终包并写 run-context。最终阶段修复轮检查修复证据、完整注册和最新映射，逐页重新准入。不要求最终 build_id 等于前期包，也不伪造最终 navigation-gate PASS。

依据设计给出的页面顺序串行运行 PAGE suites，必要的 JOURNEY 与明确生命周期专项单列，不能只扫描 pages 而漏掉它们。优先单一功能 runner 批次，不为每页/每例重新安装、重启应用或重启 daemon。外部宿主仍使用其真实可见入口，不把默认 Ability 启动当切页手段。

### 7.2 页面与用例生命周期

- 页面 beforeAll：经 navigation 的真实组件点击到页，等待唯一 landmark，写最终包/当前会话的 page-admissions PASS 后才执行业务；根页/已在本页时现场复核身份，不伪造点击。
- 每例 beforeEach：重新定位本页 landmark，检查并经真实 UI 建立本例基线。失败在当前 ID 保留 SETUP/INFRA 证据，停止新业务操作，不复位应用。
- 每例 it：一个功能点、真实组件动作、UI 结果断言；可单例筛选，不依赖其他 it。
- 每例 afterEach：有限 UI 清理，若已离页则经 navigation 恢复到 owner 页，重新验证基线。业务已失败时保留其首因并附清理证据；业务通过但清理失败为 ERROR/SETUP（设备故障 INFRA），不能计 GREEN。
- 基线无法恢复：记录 session unsafe，停止新的业务操作。调度器明确未开始的后续项为 DEFERRED/SESSION_UNSAFE，不计功能失败；已经开始但因真实 runner 崩溃未完成的项仍为 ERROR/INFRA。
- 页面间经可见组件切换，不缓存 Component 或用内部导航栈确定当前页。页面 afterAll 不重启/终止/复位应用。

### 7.3 导航回归与重启例外

最终页面调度必须遍历 EXPECTED_PAGES：没有 RUNNABLE 功能的页面仍由 scheduler 调用实际入页 flow 并记录准入（不伪造业务 it）；只有本页功能实际执行/明确分流且清理完成后切换下一页。仅前期使用的其他入口 preflight 不作为最终必跑项，最终 required_admission_flow_ids 必须与逐页计划一致。

套级准入、页间切换或恢复 flow 真正运行时写 PAGE_ENTRY/RECOVERY 观察，仍关联设计的原 flow ID。导航重新失败立即关门：已完成业务/静态终态保留，直接依赖该根且未执行的用例 blocked，其他未执行业务 DEFERRED/NAVIGATION_GATE；停止新业务并分诊/修复，最终包重新构建后按页点击准入复测，不新增临时根 ID，也不自动追加独立全量导航。普通 beforeEach 在本页检查成功不伪造 flow invocation。

重新安装、崩溃恢复和冷启动/重启持久化专项严格按会话契约处理。崩溃保留原结果，新会话须重新做实际页面准入；生命周期专项放普通批次之后，保留原 expected，在重启后经 UI 到页观察，不能先清理掉要验证的持久化值。

### 7.4 产品与静态结果

真实业务操作完成但结果不符/缺失为 RED/FUNCTION；证据确认可见能力未实装可为 RED/IMPL_MISSING。IMPL_MISSING_STATIC 不选入 runner，保留原稳定 ID 的静态 RED；单个页内无合法 locator 的需求按页面记录分流。两者不与导航门错误混淆。

来源页需求“点击入口到达目标 surface”仍是 PAGE 用例，失败归该业务 ID，不作为其他页的 canonical setup 根。Ignore、DEFERRED、blocked、编译失败都不能计通过或从 PLANNED 分母删除。

## 8. 解析结果与算术自检

兼容官方输出单复数，但以最终汇总行为准：

```text
Tests run: N, Failure: F, Error: E, Pass: P, Ignore: I
```

逐阶段解析 `RUN/FAILURE/ERROR/PASS/IGNORE`。若输出没有显式 Pass：

```text
PASS = RUN - FAILURE - ERROR - IGNORE
```

不得使用 `RUN - FAILURE - ERROR`，否则 Ignore 会被误算 PASS。解析后强制检查：

```text
RUN == PASS + FAILURE + ERROR + IGNORE
PASS >= 0
```

不成立时视为 `ERROR + failure_class=INFRA`，保存原始日志并停止计算“通过率”。逐用例用 status/test name 对账，重复、缺失或出现未注册测试都属于 registration/infra 问题。

调度器有门票/session-events 证据证明的主动暂缓单列 DEFERRED，不混入实际执行数；已排队 hook 的暂停信号保留 raw ERROR/IGNORE 证据，但按受控调度规则归一，不能把信号当业务执行或伪 PASS。其他 `IGNORE` 只保留在 runner 原始统计中，不是问题文件允许的 `kind`。仍在 inventory 的用例若被过滤、标 Ignore 或因测试配置未执行，归一为 `ERROR/SETUP`；若 runner、注册或基础设施无法给出结果，归一为 `ERROR/INFRA`。每个原始 Ignore 都必须进入其中一类并写证据，不得把它漏出账本或当成 GREEN。

## 9. 四类报告与指标

写 `spec/verify/ui/ui-report.md`，分四个互不混算的部分：

### A. 页面可达性

- 每页入口类别、canonical flow、`REACHED | BLOCKED | UNREACHABLE_BY_UI`；`BLOCKED` 必须链接到对应 `RED/ERROR` 导航根问题。
- `页面总体到达率 = REACHED_PAGE / TOTAL_PLANNED_PAGE`。
- 另报 `可自动化路径到达率 = REACHED_AUTOMATABLE_PAGE / AUTOMATABLE_PAGE`，同时列出不可达页，不能用排除不可达后的比例冒充总体实现率。

### B. 导航 flow 与 edge 诊断

- 每个 flow_id 的 source/target、`GREEN/RED/ERROR`、根分类与失败证据；其下按 edge_id 列 source/action/target、是否执行和首个失败点。根文件 ID 始终是 flow ID。
- `导航 flow 通过率 = GREEN_FLOW / PLANNED_EXECUTABLE_FLOW`；未注册/未执行 flow 留在分母。edge 只作为诊断步骤，不另算根问题或 setup 用例。

### C. 页面功能点

- 漏斗：`PLANNED → GENERATED → REGISTERED → COMPILEABLE → EXECUTED → GREEN`；`IMPL_MISSING_STATIC` 保留在 PLANNED 分母并单列，不计入 GENERATED/REGISTERED/EXECUTED，也不能从需求满足率分母删除。
- 账本终态计数：`GREEN / RED / ERROR / BLOCKED_BY_NAVIGATION / DEFERRED`；runner 的 `IGNORE` 另列原始数量，并同时报告它归一到 `ERROR/SETUP`、`ERROR/INFRA` 与有调度证据的 `DEFERRED` 的数量。另只对根文件按 `failure_class` 报告 `UNREACHABLE_BY_UI` 等独立首因数。
- `需求满足率 = GREEN_FUNCTION_POINT / PLANNED_FUNCTION_POINT`。
- `已形成终态结果中的 GREEN 占比 = GREEN / (GREEN + RED + ERROR)`，只作为账本分布辅助；其中 ERROR 可能未执行，不能称“已执行通过率”。必须与需求满足率并列，不能隐藏 blocked/compile/ignore。
- 每个 PAGE/JOURNEY 业务 `it()` 一行，只对应一个功能点，并在报告中标出 `case_kind` 与唯一 owner；每个 `IMPL_MISSING_STATIC` 功能点另占一行静态 `RED/IMPL_MISSING`，明确 `business_assertions_run=false`。RED/ERROR 附首行原因和 evidence 路径。canonical preflight 在 B 节单列，不混入业务功能点。

### D. 基础设施

- 导航门状态、build/plan/device 指纹、会话数量、INITIAL_START 与三类重启原因；逐页 UI 基线检查、清理和安全暂停证据。

- SDK/API profile、静态 preflight、双 HAP 构建、安装、系统 ArkUI 测试能力参数、设备/解锁、daemon 语法来源、运行锁、每阶段 timeout、原始 RUN/PASS/FAILURE/ERROR/IGNORE。
- compile/registration/setup/framework/application crash 分开，不混为功能失败。

不要再输出“覆盖率 × 通过率 ≈ 实现率”之类无法证明的合成指标。

## 10. 写验证账本与证据

按 `references/fix-file-schema.md` 与 `references/reconcile-rules.md` 写本轮账本：先落盘本 PHASE 的 planned/case inventory、non-runnable page records、navigation observations、session-events 和原始结果；NAVIGATION 写 navigation-gate 并封存前期 round，尚未完成的功能清单不纳入该轮。FUNCTION 写最终包 run-context/page-admissions 并引用 PRECHECK_REF，在完成或失败/主动停止时封存最终 round；reconcile 统一生成 `evidence/case-outcomes.json`，每个 case inventory ID 恰好一条终态。静态 ENTRY_GAP 根/blocked 与 IMPL_MISSING_STATIC 按设计证据合成；不可达 planned ID 不各自产生 outcome，而是由唯一 `UNREACHABLE_<page_id>` 额外页面 outcome 聚合；共享基础设施错误由 `INFRA_UI_SHARED_SETUP` 及逐用例 `cause_id` 关联。canonical writer 只根据最终 outcome 写问题文件。edge 只作 flow 根内的诊断步骤。

frontmatter 必须采用 `references/fix-file-schema.md` §三的完整字段，不得增加 `schema_version` 或省略 `cause_id` 等必需字段。`page_id` 为设计中的 `P{NNNN}`，仅全局 infra 可为 null；`feature_point` 为一句话；静态/不可达/共享 infra 记录的 `test_file` 按 schema 允许为 null。`blocked_by` 仅用于导航 blocked；`cause_id` 仅用于关联共享根的逐用例 `ERROR/INFRA`，两者不可同时非空。静态功能缺口固定 `blocked_by=cause_id=null`。

正文至少包含：Spec/设计引用、用户可观察期望、真实实际结果、失败阶段、源码/flow 定位、修复建议、evidence 相对路径。不要写 AppStorage/内部状态“双断言”作为期望。

- 完整原始 build/install/device/navigation/function 日志，以及版本能力允许时生成的 dump/截图，都必须在本 round `evidence/`；问题文件只摘首行并链接证据。dump 仍受 API/设备版本门禁，诊断失败单独记录，不能覆盖原始失败。
- ROUND >= 1 时按 reconcile 规则生成 `_ui_delta.md`；carry-forward 只保留 schema 指定的人工 disposition/related 字段，运行事实每轮重算。
- 更新 `spec/verify/ui/_state.yaml` 的 current_round/last_verifier_run_at/source；保留外层循环拥有的状态字段。
- 自检 schema、索引、汇总、delta 和证据路径；失败时 BLOCK，不吞掉原始失败，也不用“诊断失败”覆盖最初 test failure。

