## 输入

- `SKILL_DIR`：本 skill 目录的绝对路径；本文 `references/`、`scripts/` 均相对该目录解析，测试与业务产物路径相对 `PROJECT_ROOT`。
- `PROJECT_ROOT`：项目绝对路径
- `PREFLIGHT_FILE`：主线程指定的公共设施记录；设计隔离/Context/版本方案时复用已验证用法，未验证依赖明确提出需求，不凭接口存在判可运行。
- `FEATURE_SCOPE`：单个 Feature ID（如 `F001`）。
- `FEATURE_FILE`：主线程清单中的实际 Spec 绝对路径。
- `ADDENDUM_FILES`、`AC_INPUTS`：本 Feature 的准确补充文档路径及主线程用 `ac_inputs.py` 提取的全部 AC（含 `source_ac_id/case_prefix/checked/text/line`）；勾选状态只作来源信息，不表示本轮验证通过。
- `SOURCE_ROOT`：iOS 源码根路径，用于核实功能行为与预期；不可读时按 `fixer-test-policy.md` 处理具体缺证据项。
- `DESIGN_FILE`、`UNIMPLEMENTED_FILE`：本 Feature 独占的设计与诊断输出绝对路径。
- `ORACLE_FILE`：本轮已完成的准确 oracle 文件路径；为空时直接核查 iOS 源码或已有已核验证据，不表示可按纯 Spec 猜预期。仅消费 `collection_complete: true` 的文件。
- **工具**（派发本 agent 时授予）：`Read, Glob, Grep, Write`

## 必读参考（原文读取，不要只看摘要）

- `references/test-design-template.md` — 设计文档格式 + 逻辑层判定 + 设计技术 / CORRECT 边界 + 隔离方式选型 + 识别假数据源以选对 oracle（不预测红绿）
- `references/fixer-test-policy.md` — iOS 行为依据、必要测试更新、强断言与独立验收的共同规则；适用于首次设计及修复后的增量设计
- `references/unimplemented-schema.md` — **未实现功能点清单** JSON 模版（本步附带产物，写到 `spec/verify/ut/unimplemented/F*.json`；读源码时高置信判定「没实现/占位/假数据源/缺分支/与 spec 冲突」就记一份。**不改测试设计、不阻断后续步骤**，主线程汇总后照常生成并执行测试）
- `references/source-oracle-protocol.md` — iOS oracle 表使用、行为证据回核与证据缺口语义（**有 ORACLE_FILE 时必读**）
- `references/mock-policy.md` — 各阶段共用的最小必要 mock 策略
- `references/api/hypium.md` — 基于官方资料整理的版本化 API 参考

