## 执行流程

### 1. 核对环境并读 Spec

先读项目依赖配置、锁文件和已安装 Hypium 声明，记录实际版本、SDK API、Stage 模型与编译模式。不因 README master 有某个接口就假定项目可用，也不在设计阶段升级依赖。

- 读取准确 `FEATURE_FILE` 及 `ADDENDUM_FILES`，校验主文件 ID 与 `FEATURE_SCOPE` 一致，核对 `addenda` 声明和 `impl: <文件> §<节>` 指针；缺文件/节返回具体输入错误，不静默忽略补充行为。只跟随本 Feature 的准确补充路径，**不读、不处理范围外的 Feature**。
- 读不到分到的 Feature 文件 → 返回 `BLOCKERS: <feature> 在 spec/baseline/features/ 不存在`，终止（不要自己造 Spec）。

### 2. 逐 Feature 设计

对 `FEATURE_SCOPE` 内的每个 Feature 文件：

1. 逐条核对 `AC_INPUTS` 与主文件 `## 验收标准` 下所有 `- [ ]`、`- [x]`、`- [X]`（不含围栏代码示例），按 `test-design-template.md` 的表把**逻辑层** AC 挑出来
   （纯 UI 类 AC 记入设计的“UI 范围记录”，不展开 UI 测试步骤；混合 AC 拆出逻辑用例与 UI 记录）。
   “追溯AC”保留原 `F001-AC07`，用例前缀使用对应 `F001_AC07`，不因勾选、排序、删除或补充文档位置改变编号。沿用已有用例 ID，不给历史 AC 重新分配身份；源 ID 缺失/重复/前缀错误时交主线程核对既有映射，不能自行修改基线。补充文档细化原 AC 的行为义务，不另按复选框顺序发行 AC。
1b. **再读 `## Service layer` / `## Data flow`（同义：`## 服务层` / `## 数据流`）补 AC 没展开的可观测分支**：
   某 AC 映射的焦点函数在这两节被列出**输出模式 / 基数布局 / 输入→输出映射**（比 AC 细）时，**每个枚举各拆一行**、
   「追溯AC」回溯到那条 AC。只取可观测行为分支，以该节定位 iOS 对应实现并核实预期，纯实现机制不入测试点。
   这一步也能**捞回被 UI 措辞（"render…"）误判掉的逻辑**（如 `composeCollageBitmap` 的 strip / 网格 / 格数布局）。
2. 读该 Feature 相关 iOS 源码及明确批准的平台差异，确定输入、输出、边界、错误、状态和副作用；再读鸿蒙对应 service / model / viewmodel，选择真实调用入口与最小隔离方式。鸿蒙源码用于确认调用方式和构造能区分对错的输入，不作为预期值的自证来源。
2.5. **查准确 `ORACLE_FILE` 回填字段级具体值（本轮已完成的文件存在时）**：
   Spec 定位范围与 AC，iOS 源码及已核实 oracle 确定行为和具体值。把设计表「预期结果」列填为有证据的具体值（枚举 code、算法 I-O 三元组、wire 字段+tag、完整集 size+逐成员），「预期来源」填
   `样本(iOS)` 并在备注追 `oracle: <path:line>`。规则：
   - 完整性清单类 AC（"N 种…"）→ 用 oracle §2 的**全集 size + 逐成员**断言（脚本已点清），**不抽查、不交人工**。
   - `wire-uncertain` 项 → 仅对已核实的往返契约写 `parse(write(x))==x`；外部 wire 兼容性另列待确认，不能用往返自洽替代 iOS 格式证据。
   - `golden-degraded` 项 → 备注证据缺口，仅保留有依据且能识别错误实现的部分断言；无法确定核心预期则该行记 `needs_review`，禁止改写为宽松断言凑可执行数。
   - oracle 与 Spec **数量冲突**（oracle 表标 `diff`/`needs-human`）→ 回核 iOS 源码与批准账本；证据明确时按行为依据设计并记录 Spec 冲突，否则仅该行 `needs_review`。
   - oracle 表**无该 Feature / 无该项 / `oracle_status=spec_only(diverges)`** → 直接核查 iOS 源码或已核验证据；不得仅凭状态名接受未经批准的差异，也不退化为 Spec 猜测。iOS 暂不可读时可继续已有测试/已核验证据覆盖的行，缺证据行单列，不阻断其它行。
3. 按 `mock-policy.md` 和 `test-design-template.md` 填“依赖与隔离”：真实链路、替换点或无、必要原因、粒度/工具、清理方式、运行组。持久化和重启契约必须保留真实保存/读取路径；确需隔离时优先已有注入点或局部替换，最后考虑 import mock。需要私有/静态成员替换时核对版本及调用路径，不默认公开字段或拆模块。
4. 按选定的设计技术 + CORRECT 边界把一条 AC 拆成多行（每行一个用例ID）；序列化 / 映射类补一条 Inverse 往返用例。
4b. **逐行记录类型**：按 `test-design-template.md` 的“可执行类型与实现状态”填写 `testability`、`implementation_status`、真实调用入口（实际文件/符号/调用链）及分类依据。逻辑行分 `ut/no_entry/needs_review`；UI AC 单列为 `ui_only`。实现状态与可执行性独立：部分实现、占位或行为冲突，只要预期有 iOS/批准差异证据且有真实入口仍是 `ut`，必须生成强断言；不能把 Spec 中的概念类名当作必须存在的代码类型。
5. **顺手记未实现功能点（附带诊断，不阻断流程，不改设计）**：第 2 步读源码时，若**高置信**看出某功能点在鸿蒙源码里
   **没实现**——焦点符号 grep 不到（`missing`）/ 占位（空体、`throw 'Not implemented'`、仅日志、`// TODO` = `placeholder`）/
   假数据源（写死常量、`PH-*` 占位、仅 `emit` = `fake_data_source`）/ 缺 spec·§Service layer·oracle 列的某些分支（`partial`）/
   实装与 iOS 行为/已批准差异明显冲突（沿用诊断状态 `spec_conflict`，在 evidence 说明真实冲突依据）——就把它收集进本 Feature 的「未实现清单」，**注明出自 Spec 哪个 Feature、
   功能点是什么、iOS 行为依据及鸿蒙源码片段**。判定边界（**只记高/中置信的明显情形，模糊不记**）+ JSON 字段见 `references/unimplemented-schema.md`。
   此清单仅作设计期初判，**不构成 BLOCKERS，不等待用户补全，也不阻断测试生成、编译、执行或后续 fix-loop**；
   对应用例照常按已核实的 iOS 行为/批准差异写满，以实际验证结果为准（见下「不做的事」）。
6. 修复后按主线程分配的受影响用例增量复核：纯内部实现变化不重写正确设计；旧 `no_entry` 已有真实入口时，保留业务预期并补齐入口、状态和生成所需信息。主线程先协调本 Feature 设计、生成记录和测试文件的独占所有权，不与 fixer 或生成器同时改同一产物。

### 3. 写设计文档

写入准确 `DESIGN_FILE`，按 `test-design-template.md` 的结构保存契约、逐行类型、UI 范围记录及分类计数。读源码时可分块保存，最终回读核对所有逻辑用例的类型与数量后再返回。

> 目录 `spec/verify/ut/ut-design/` 不存在就创建。

### 3.5 写未实现功能点清单（附带诊断，不阻断流程，仅有命中项时）

若步骤 5 在某 Feature 收集到 ≥1 个未实现功能点，就为该 Feature 写一份 JSON：
准确 `UNIMPLEMENTED_FILE`，严格按 `references/unimplemented-schema.md` 的 Schema
（顶层 `feature_id/feature_name/spec_file/detected_by/detected_at_stage/points` + 每点 `point_id/trace_ac/feature_point/spec_ref/status/confidence/evidence/source/design_case_ids`）。

> - 目录 `spec/verify/ut/unimplemented/`（skill 私有根 `spec/verify/ut/` 下、与 `ut-design/` 同级）不存在就创建；**没有命中项的 Feature 不写文件**（不产生空 JSON）。
> - 与设计文件同名、只换扩展名（设计 `spec/verify/ut/ut-design/F012_collage_export.md` ↔ 清单 `spec/verify/ut/unimplemented/F012_collage_export.json`），`point_id` 与设计表用例ID对齐。
> - 未实现项及其数量仅用于诊断汇总，不作为流程控制信号；不得因此返回 `BLOCKERS` 或要求用户补全后才能继续。
> - 你**不执行校验脚本**：写完用 `Read` 回读自己的 JSON，逐字段对照 schema §二 自查。可执行脚本校验由主线程在收到本 Feature 设计后执行；不等待其它 Feature 的诊断汇总，格式问题不阻断可执行用例生成。
> - 此文件**不参与** step2/step3/`arkts-ut-fixer` 派单；测试设计本身一字不少照常生成。

### 4. 不做的事

- ❌ 不写 `.test.ets` 测试代码（第二步）
- ❌ 不编译 / 不跑测试（第三步）
- ❌ 不设计 UI 测试
- ❌ 不修改 `spec/baseline/` 下任何文件（Spec 为范围与追溯文档，只读；行为以 iOS 源码及批准差异为准）
- ❌ 不因「记了未实现」就**少设计/弱化/跳过**对应用例——未实现清单是旁路记录，有证据的行为仍写满强断言，缺证据明确保留 `needs_review`（不预测红绿，标准 5）
- ❌ 不自己暂停流程、不等用户、不催补全——你只如实写 `spec/verify/ut/unimplemented/F*.json` 并返回 `UNIMPL_POINT_COUNT`；**主线程汇总后也须继续生成和执行，不因未实现项暂停**
- ❌ 不修源码、不写 `spec/verify/ut/round-*`（那是 fix-loop 的事）；未实现清单只写 `spec/verify/ut/unimplemented/`

