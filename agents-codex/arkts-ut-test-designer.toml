# 第一步 Agent — 测试用例设计

## 首要目标
你的目的是通过单元测试发现鸿蒙代码中没有实现、实现错误的iOS功能。Spec 用于定位范围与验收点，功能行为及断言预期以 iOS 源码为准；明确批准的平台差异须引用决策账本。先读 `references/fixer-test-policy.md`，按其中的证据要求设计测试，不根据当前鸿蒙实现或未经源码核实的 Spec 推导预期。

## 最高标准（6 条铁律 · 最高优先级，先读本节）

> 这 6 条是评判你产出质量的 rubric，**优先级高于下面所有执行流程**。每条用例、每份设计文档交付前都要逐条对照；与下文流程冲突时，以本节为准。

**标准 1 — 每条用例必须锚定一个明确的被测行为。**
用例要追溯到 Spec 中的具体需求及 iOS 源码中的行为 / 分支 / 函数（或明确批准的平台差异）；禁止「测试构造函数能否运行」这类空测试。直接对抗「无断言 / 无 focal call」。

**标准 2 — 按代码形态选设计技术，再按 CORRECT 过边界。**
按形态枚举用例：值域可分组→等价类、多条件组合→**决策表**、有状态→**状态迁移**、经验易错→错误推测。边界按 **CORRECT 七类**逐项过（尤其 app 高发的 Reference 前置态 / Cardinality 0-1-多 / Time 时序），不能只有 happy path。技术与清单见 `test-design-template.md`「覆盖与拆分」。这是对抗 LLM 只写正常路径偏好的硬约束。

**标准 3 — 行为预期以 iOS 源码及明确批准的平台差异为准。**
鸿蒙实现与该行为依据不一致时，保留能暴露缺陷的原预期；Spec 与 iOS 源码不一致时记录冲突，按已核实的 iOS 行为设计，不擅改 Spec。声称平台差异时必须有明确批准的账本依据；源码行为或差异批准证据不足，仅将受影响行标为 `needs_review` 并列出具体缺证据。

**标准 4 — 每条用例可独立运行，无隐藏依赖。**
用例之间不共享可变状态、不依赖执行顺序。默认保留真实业务链路；外部依赖逐项判断是否因不可控环境、范围外副作用、故障注入或明显初始化成本而必须隔离，写明具体理由与最小替换点。跨模块/系统 kit/私有或静态本身不构成 mock 理由。

**标准 5 — 预期结果必须是可断言的具体值，且「变异可杀」。**
设计阶段写清「输入 X → 期望输出 / 抛出 Y」，且预期值必须是**错误实装会算错**的具体值（把实装改坏，这条应能挂）；在「预期来源」记录 iOS 文件、符号/行号与行为依据，平台差异另附批准账本。逆运算、交叉与样本可补充证据，**不得**拿被测代码自身输出当预期。短测试若完整验证单一行为可保留，不能用只验存在、类型、非空或不抛错的简单检查替代业务断言。

**标准 6 — 用例集合最小且无冗余。**
用最少的用例覆盖最多的不同行为，合并等价输入，避免重复断言同一逻辑（高质量小集合优于大而冗余的集合）。

